name: Apply collector analysis rate-limit repair

on:
  push:
    branches:
      - fix/collector-analysis-rate-limit
    paths:
      - .github/workflows/apply-collector-analysis-rate-limit-fix.yml

permissions:
  contents: write

concurrency:
  group: apply-collector-analysis-rate-limit-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/collector-analysis-rate-limit
          fetch-depth: 0

      - name: Apply exact bounded repository repair
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              content = target.read_text(encoding="utf-8")
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, observed {count}")
              target.write_text(content.replace(old, new, 1), encoding="utf-8")

          installer_old = '''    location /api/ {
                  limit_req zone=servicetracer_demo_api burst=2 nodelay;
                  proxy_pass http://127.0.0.1:${LOCAL_PORT};
                  proxy_http_version 1.1;
                  proxy_set_header Host \\$host;
                  proxy_set_header X-Forwarded-For \\$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \\$scheme;
                  proxy_connect_timeout 5s;
                  proxy_read_timeout ${PROXY_READ_TIMEOUT_SECONDS}s;
                  client_max_body_size 4k;
              }
          '''
          installer_new = '''    # Health and provenance polling are deliberately outside the analysis limiter.
              # A healthy endpoint does not prove that a live analysis request completed.
              location = /api/health {
                  proxy_pass http://127.0.0.1:${LOCAL_PORT};
                  proxy_http_version 1.1;
                  proxy_set_header Host \\$host;
                  proxy_set_header X-Forwarded-For \\$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \\$scheme;
                  proxy_connect_timeout 5s;
                  proxy_read_timeout 10s;
              }

              # Browser execution requires a CORS preflight and a POST. Keep rate limiting
              # on the expensive analysis path while reserving enough burst for that pair.
              location = /api/demo/run {
                  limit_req zone=servicetracer_demo_api burst=4 nodelay;
                  limit_req_status 429;
                  proxy_pass http://127.0.0.1:${LOCAL_PORT};
                  proxy_http_version 1.1;
                  proxy_set_header Host \\$host;
                  proxy_set_header X-Forwarded-For \\$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \\$scheme;
                  proxy_connect_timeout 5s;
                  proxy_read_timeout ${PROXY_READ_TIMEOUT_SECONDS}s;
                  client_max_body_size 4k;
              }

              location /api/ {
                  return 404;
              }
          '''
          replace_once("infra/scripts/install_collector_demo_api.sh", installer_old, installer_new)

          replace_once(
              "docs/live-monitor.js",
              "apiReady ? 'Healthy API response' : 'Health contract rejected'",
              "apiReady ? 'Health endpoint reachable' : 'Health contract rejected'",
          )
          replace_once(
              "docs/live-monitor.js",
              "setMonitorState('Frontend ↔ governed collector API live', 'healthy');",
              "setMonitorState('Collector health and Azure identity verified', 'healthy');",
          )

          replace_once(
              "docs/app.js",
              """      elements.reportSourceName.textContent = 'Controlled demo fixture — API unavailable';
                    elements.reportSourceDetail.textContent = 'The live Azure API failed; using the controlled fixture.';""",
              """      elements.reportSourceName.textContent = 'Controlled demo fixture — live analysis unavailable';
                    elements.reportSourceDetail.textContent = 'Collector health was verified, but the live analysis request did not complete; using the controlled fixture.';""",
          )
          replace_once(
              "docs/app.js",
              """        elements.reportSourceName.textContent = 'Controlled demo fixture — API unavailable';
                      elements.reportSourceDetail.textContent = 'The configured API did not pass its health contract; no live transactions will run.';""",
              """        elements.reportSourceName.textContent = 'Controlled demo fixture — API health unavailable';
                      elements.reportSourceDetail.textContent = 'The configured API did not pass its health contract; no live transactions will run.';""",
          )

          workflow_path = ".github/workflows/collector-demo-api.yml"
          workflow = Path(workflow_path).read_text(encoding="utf-8")
          workflow = workflow.replace(
              """          ALLOWED_ORIGIN: ${{ inputs.allowed_origin }}
                    run: |""",
              """          ALLOWED_ORIGIN: ${{ inputs.allowed_origin }}
                    REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
                    run: |""",
              1,
          )
          old_verification = '''          for _ in $(seq 1 30); do
                    if curl --fail --silent --show-error "$health_url" > "$ARTIFACT_DIR/api-health.json"; then
                      break
                    fi
                    sleep 10
                  done
                  jq -e '.status=="healthy" and .backend_target_configured==true and .hosting_model=="collector_vm_systemd"' "$ARTIFACT_DIR/api-health.json" > /dev/null

                  curl --fail --silent --show-error \\
                    --request POST \\
                    --header 'Content-Type: application/json' \\
                    --header "Origin: ${ALLOWED_ORIGIN}" \\
                    --data '{"attempts":20}' \\
                    "$run_url" > "$ARTIFACT_DIR/api-run.json"
                  jq -e '.schema_version=="servicetracer.demo-api-response.v1" and (.transactions|length)==20 and .report.investigation_boundary.exact_root_cause_claimed==false' "$ARTIFACT_DIR/api-run.json" > /dev/null

                  curl --fail --silent --show-error \\
                    --request OPTIONS \\
                    --header "Origin: ${ALLOWED_ORIGIN}" \\
                    --header 'Access-Control-Request-Method: POST' \\
                    --dump-header "$ARTIFACT_DIR/cors-headers.txt" \\
                    --output /dev/null \\
                    "$run_url"
                  grep -Eiq "^access-control-allow-origin: ${ALLOWED_ORIGIN}\\r?$" "$ARTIFACT_DIR/cors-headers.txt"

                  jq -n \\
                    --arg fqdn "$fqdn" \\
                    --arg health_url "$health_url" \\
                    --arg run_url "$run_url" \\
                    '{schema_version:"servicetracer.collector-demo-api-verification.v1",fqdn:$fqdn,health_url:$health_url,run_url:$run_url,tls_verified:true,health_verified:true,twenty_correlated_transactions_verified:true,cors_verified:true,service_validated:true}' \\
                    > "$ARTIFACT_DIR/verification.json"
          '''
          new_verification = '''          for _ in $(seq 1 30); do
                    if curl --fail --silent --show-error "$health_url" > "$ARTIFACT_DIR/api-health.json"; then
                      break
                    fi
                    sleep 10
                  done
                  jq -e '.status=="healthy" and .backend_target_configured==true and .hosting_model=="collector_vm_systemd"' "$ARTIFACT_DIR/api-health.json" > /dev/null

                  # Prove that repeated health/provenance polling is not charged against the
                  # live-analysis limiter before exercising the browser-equivalent request pair.
                  for attempt in $(seq 1 12); do
                    curl --fail --silent --show-error "$health_url" \\
                      > "$ARTIFACT_DIR/api-health-burst-${attempt}.json"
                  done

                  request_id="$(python3 - <<'PYREQUEST'
          import uuid
          print(uuid.uuid4())
          PYREQUEST
                  )"

                  curl --fail --silent --show-error \\
                    --request OPTIONS \\
                    --header "Origin: ${ALLOWED_ORIGIN}" \\
                    --header 'Access-Control-Request-Method: POST' \\
                    --header 'Access-Control-Request-Headers: Content-Type, X-ServiceTracer-Request-ID' \\
                    --dump-header "$ARTIFACT_DIR/cors-headers.txt" \\
                    --output /dev/null \\
                    "$run_url"

                  curl --fail --silent --show-error \\
                    --request POST \\
                    --header 'Content-Type: application/json' \\
                    --header "Origin: ${ALLOWED_ORIGIN}" \\
                    --header "X-ServiceTracer-Request-ID: ${request_id}" \\
                    --dump-header "$ARTIFACT_DIR/api-run-headers.txt" \\
                    --data '{"attempts":20}' \\
                    "$run_url" > "$ARTIFACT_DIR/api-run.json"

                  python3 - "$ALLOWED_ORIGIN" "$request_id" "$REVIEWED_COMMIT" <<'PYVERIFY'
          import json
          import sys
          from pathlib import Path

          allowed_origin, request_id, reviewed_commit = sys.argv[1:]

          def parse_headers(path):
              parsed = {}
              for line in Path(path).read_bytes().decode('iso-8859-1').splitlines():
                  if ':' not in line:
                      continue
                  name, value = line.split(':', 1)
                  parsed[name.strip().lower()] = value.strip()
              return parsed

          cors = parse_headers('collector-demo-api-evidence/cors-headers.txt')
          run_headers = parse_headers('collector-demo-api-evidence/api-run-headers.txt')
          payload = json.loads(Path('collector-demo-api-evidence/api-run.json').read_text(encoding='utf-8'))

          assert cors.get('access-control-allow-origin') == allowed_origin
          assert 'POST' in cors.get('access-control-allow-methods', '')
          assert 'X-ServiceTracer-Request-ID'.lower() in cors.get('access-control-allow-headers', '').lower()
          assert run_headers.get('access-control-allow-origin') == allowed_origin
          assert run_headers.get('x-servicetracer-request-id') == request_id
          assert payload.get('request_id') == request_id
          assert payload.get('schema_version') == 'servicetracer.demo-api-response.v1'
          assert len(payload.get('transactions') or []) == 20
          assert payload.get('report', {}).get('investigation_boundary', {}).get('exact_root_cause_claimed') is False
          identity = payload.get('azure_host') or {}
          assert identity.get('verified') is True
          assert identity.get('source_ref') == reviewed_commit
          PYVERIFY

                  jq -n \\
                    --arg fqdn "$fqdn" \\
                    --arg health_url "$health_url" \\
                    --arg run_url "$run_url" \\
                    --arg request_id "$request_id" \\
                    '{schema_version:"servicetracer.collector-demo-api-verification.v2",fqdn:$fqdn,health_url:$health_url,run_url:$run_url,request_id:$request_id,tls_verified:true,health_verified:true,health_burst_verified:true,twenty_correlated_transactions_verified:true,cors_verified:true,request_id_correlation_verified:true,collector_identity_verified:true,service_validated:true}' \\
                    > "$ARTIFACT_DIR/verification.json"
          '''
          if workflow.count(old_verification) != 1:
              raise SystemExit("collector workflow verification block did not match exactly once")
          Path(workflow_path).write_text(workflow.replace(old_verification, new_verification, 1), encoding="utf-8")

          test_source = r'''from __future__ import annotations

          from pathlib import Path
          import unittest


          ROOT = Path(__file__).resolve().parents[2]
          INSTALLER = ROOT / "infra" / "scripts" / "install_collector_demo_api.sh"
          APP = ROOT / "docs" / "app.js"
          MONITOR = ROOT / "docs" / "live-monitor.js"
          WORKFLOW = ROOT / ".github" / "workflows" / "collector-demo-api.yml"


          class CollectorAnalysisRateLimitFixTests(unittest.TestCase):
              def test_health_polling_is_outside_analysis_rate_limiter(self) -> None:
                  source = INSTALLER.read_text(encoding="utf-8")
                  health = source.split("location = /api/health {", 1)[1].split(
                      "location = /api/demo/run {", 1
                  )[0]
                  analysis = source.split("location = /api/demo/run {", 1)[1].split(
                      "location /api/ {", 1
                  )[0]
                  self.assertNotIn("limit_req", health)
                  self.assertIn("proxy_read_timeout 10s", health)
                  self.assertIn("limit_req zone=servicetracer_demo_api burst=4 nodelay", analysis)
                  self.assertIn("limit_req_status 429", analysis)
                  self.assertIn("client_max_body_size 4k", analysis)
                  self.assertNotIn("location /api/ {\n        limit_req", source)

              def test_unknown_api_paths_fail_closed(self) -> None:
                  source = INSTALLER.read_text(encoding="utf-8")
                  fallback = source.split("location /api/ {", 1)[1].split("location / {", 1)[0]
                  self.assertIn("return 404", fallback)

              def test_frontend_copy_separates_health_from_analysis(self) -> None:
                  app = APP.read_text(encoding="utf-8")
                  monitor = MONITOR.read_text(encoding="utf-8")
                  self.assertIn("Controlled demo fixture — live analysis unavailable", app)
                  self.assertIn("Controlled demo fixture — API health unavailable", app)
                  self.assertIn("Collector health was verified, but the live analysis request did not complete", app)
                  self.assertNotIn("Controlled demo fixture — API unavailable", app)
                  self.assertIn("Health endpoint reachable", monitor)
                  self.assertIn("Collector health and Azure identity verified", monitor)
                  self.assertNotIn("Frontend ↔ governed collector API live", monitor)

              def test_deployment_verifies_health_burst_cors_and_request_correlation(self) -> None:
                  workflow = WORKFLOW.read_text(encoding="utf-8")
                  for required in (
                      "api-health-burst-${attempt}.json",
                      "Access-Control-Request-Headers: Content-Type, X-ServiceTracer-Request-ID",
                      "X-ServiceTracer-Request-ID: ${request_id}",
                      "request_id_correlation_verified:true",
                      "health_burst_verified:true",
                      "collector_identity_verified:true",
                  ):
                      self.assertIn(required, workflow)
                  self.assertNotIn("grep -Eiq \"^access-control-allow-origin", workflow)


          if __name__ == "__main__":
              unittest.main()
          '''
          test_source = "\n".join(line[10:] if line.startswith("          ") else line for line in test_source.splitlines()) + "\n"
          Path("infra/tests/test_collector_analysis_rate_limit_fix.py").write_text(test_source, encoding="utf-8")

          request = {
              "schema_version": "project.collector-analysis-rate-limit-fix.v1",
              "request_id": "collector-analysis-rate-limit-fix-20260727",
              "tracking_issue": 171,
              "status": "authorized_repository_repair_pending_exact_source",
              "authorized_by": "user instruction: Proceed",
              "recorded_on": "2026-07-27",
              "repository": {
                  "name": "anthonyedgar30000/azure-iac-msp-lab",
                  "base_branch": "main",
                  "base_commit": "9e87a930f262a5af2ee16a05a4fa5ef4bf7f3d25",
                  "working_branch": "fix/collector-analysis-rate-limit",
                  "open_pull_requests_observed_before_change": 0,
                  "local_working_tree": "not_observed_connector_backed_repository_changes",
              },
              "observed_browser_boundary": {
                  "collector_health_and_identity_verified": True,
                  "frontend_request_id_created": True,
                  "accepted_correlation_proof": False,
                  "fixture_fallback_used": True,
                  "exact_http_failure_status": "not_observed",
              },
              "authorized_repository_changes": [
                  "split Nginx health and analysis locations",
                  "retain analysis-only rate limiting",
                  "clarify frontend health and fallback wording",
                  "strengthen deployment verification",
                  "add deterministic tests",
                  "create exact one-shot deployment request after green source exists",
              ],
              "operational_authority": {
                  "merge_after_exact_head_ci": True,
                  "one_deployment_attempt": True,
                  "one_browser_api_verification": True,
                  "automatic_retry": False,
                  "rollback": False,
                  "scope_expansion": False,
              },
              "azure_scope": {
                  "resource_group": "rg-servicetracer-dev-westus2",
                  "location": "westus2",
                  "collector_vm": "vm-stcollector-mst-dev",
                  "collector_endpoint": "https://st-demo-api-aeg30000.westus2.cloudapp.azure.com/api/demo/run",
                  "frontend_origin": "https://anthonyedgar30000.github.io",
                  "new_resources_expected": 0,
                  "quota_delta_expected": 0,
                  "recurring_cost_delta_CAD_expected": 0,
              },
              "claim_boundaries": [
                  "health_endpoint_reachable != live_analysis_completed",
                  "repository_fix != deployed_fix",
                  "deployment_succeeded != browser_path_verified",
                  "failed_attempt != renewed_authority",
              ],
          }
          request_path = Path(".project/change-requests/collector-analysis-rate-limit-fix-20260727.json")
          request_path.parent.mkdir(parents=True, exist_ok=True)
          request_path.write_text(json.dumps(request, indent=2) + "\n", encoding="utf-8")
          PY

          rm .github/workflows/apply-collector-analysis-rate-limit-fix.yml

      - name: Validate repaired repository
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n infra/scripts/install_collector_demo_api.sh
          node --check docs/app.js
          node --check docs/live-monitor.js
          python -m unittest \
            infra.tests.test_collector_demo_api \
            infra.tests.test_collector_analysis_rate_limit_fix \
            infra.tests.test_frontend_azure_provenance_monitor \
            -v
          git diff --check

      - name: Commit bounded repair
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            infra/scripts/install_collector_demo_api.sh \
            docs/app.js \
            docs/live-monitor.js \
            .github/workflows/collector-demo-api.yml \
            infra/tests/test_collector_analysis_rate_limit_fix.py \
            .project/change-requests/collector-analysis-rate-limit-fix-20260727.json \
            .github/workflows/apply-collector-analysis-rate-limit-fix.yml
          git commit -m 'Separate collector health polling from analysis rate limiting'
          git push origin HEAD:fix/collector-analysis-rate-limit
