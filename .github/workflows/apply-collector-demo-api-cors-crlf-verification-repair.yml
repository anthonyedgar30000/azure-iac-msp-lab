name: Apply collector demo API CORS CRLF verification repair

on:
  push:
    branches:
      - fix/collector-demo-api-cors-crlf-verification
    paths:
      - .github/workflows/apply-collector-demo-api-cors-crlf-verification-repair.yml

permissions:
  contents: write

concurrency:
  group: apply-collector-demo-api-cors-crlf-verification-repair
  cancel-in-progress: false

jobs:
  apply:
    name: Patch verifier, tests, and deployment evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply exact CRLF-safe verifier repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/collector-demo-api.yml")
          source = workflow.read_text(encoding="utf-8")
          old = '          grep -Eiq "^access-control-allow-origin: ${ALLOWED_ORIGIN}\\r?$" "$ARTIFACT_DIR/cors-headers.txt"\n'
          new = (
              '          tr -d \'\\r\' < "$ARTIFACT_DIR/cors-headers.txt" > "$ARTIFACT_DIR/cors-headers-normalized.txt"\n'
              '          grep -Fxi "Access-Control-Allow-Origin: ${ALLOWED_ORIGIN}" "$ARTIFACT_DIR/cors-headers-normalized.txt"\n'
          )
          if source.count(old) != 1:
              raise SystemExit("expected exactly one legacy CRLF grep expression")
          workflow.write_text(source.replace(old, new), encoding="utf-8")
          PY

      - name: Add deterministic regression test
        run: |
          set -euo pipefail
          cat > infra/tests/test_collector_demo_api_cors_crlf_verification.py <<'PY'
          from __future__ import annotations

          import subprocess
          import unittest
          from pathlib import Path


          ROOT = Path(__file__).resolve().parents[2]
          WORKFLOW = ROOT / ".github" / "workflows" / "collector-demo-api.yml"


          class CollectorDemoApiCorsCrlfVerificationTests(unittest.TestCase):
              def test_workflow_normalizes_crlf_before_exact_origin_match(self) -> None:
                  source = WORKFLOW.read_text(encoding="utf-8")
                  self.assertIn(
                      "tr -d '\\r' < \"$ARTIFACT_DIR/cors-headers.txt\" > \"$ARTIFACT_DIR/cors-headers-normalized.txt\"",
                      source,
                  )
                  self.assertIn(
                      "grep -Fxi \"Access-Control-Allow-Origin: ${ALLOWED_ORIGIN}\" \"$ARTIFACT_DIR/cors-headers-normalized.txt\"",
                      source,
                  )
                  self.assertNotIn(
                      "grep -Eiq \"^access-control-allow-origin: ${ALLOWED_ORIGIN}\\r?$\"",
                      source,
                  )

              def test_real_http_crlf_header_survives_normalization_and_exact_match(self) -> None:
                  origin = "https://anthonyedgar30000.github.io"
                  raw = (
                      "HTTP/1.1 204 No Content\r\n"
                      f"Access-Control-Allow-Origin: {origin}\r\n"
                      "Access-Control-Allow-Methods: POST, OPTIONS\r\n"
                  ).encode()

                  normalized = subprocess.run(
                      ["tr", "-d", "\r"],
                      input=raw,
                      capture_output=True,
                      check=True,
                  ).stdout
                  self.assertNotIn(b"\r", normalized)

                  matched = subprocess.run(
                      ["grep", "-Fxi", f"Access-Control-Allow-Origin: {origin}"],
                      input=normalized,
                      capture_output=True,
                      check=False,
                  )
                  self.assertEqual(matched.returncode, 0, matched.stderr.decode())


          if __name__ == "__main__":
              unittest.main()
          PY

