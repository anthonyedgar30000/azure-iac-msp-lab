name: ServiceTracer external path verification

on:
  pull_request:
    paths:
      - ".github/workflows/servicetracer-demo-api-live-verify.yml"
      - "scripts/verify_servicetracer_external_path.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: servicetracer-external-path-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  FRONTEND_URL: https://anthonyedgar30000.github.io/azure-iac-msp-lab/
  FRONTEND_CONFIG_URL: https://anthonyedgar30000.github.io/azure-iac-msp-lab/report-source.json
  API_RUN_URL: https://st-demo-api-vm-aeg30001.westus2.cloudapp.azure.com/api/demo/run
  ALLOWED_ORIGIN: https://anthonyedgar30000.github.io
  EXPECTED_RESOURCE_GROUP: rg-st-demo-api-dev-westus2
  EXPECTED_VM_NAME: vm-st-demo-api-mst-dev
  EXPECTED_LOCATION: westus2
  EXPECTED_SOURCE_REF: ae08e7a72c14ec6deaddd3fa0f8c84b8342e0be3
  EXPECTED_HOSTING_MODEL: dedicated_vm_subproject
  EXPECTED_SOURCE_ID: st-demo-api-vm-aeg30001.westus2.cloudapp.azure.com
  EVIDENCE_DIR: servicetracer-external-path-evidence

jobs:
  verify:
    name: Verify GitHub Pages, browser CORS, provenance, and bounded transaction
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact repository state
        uses: actions/checkout@v4

      - name: Record bounded verification request
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          date -u +'%Y-%m-%dT%H:%M:%SZ' > "$EVIDENCE_DIR/observed-at.txt"
          printf '%s\n' "$GITHUB_SHA" > "$EVIDENCE_DIR/repository-sha.txt"
          printf '%s\n' "$FRONTEND_URL" > "$EVIDENCE_DIR/frontend-url.txt"
          printf '%s\n' "$API_RUN_URL" > "$EVIDENCE_DIR/api-run-url.txt"
          cat > "$EVIDENCE_DIR/authority.json" <<'JSON'
          {
            "operation": "read_only_external_service_validation",
            "azure_login_performed": false,
            "azure_query_performed": false,
            "azure_mutation_performed": false,
            "workflow_dispatch_performed": false,
            "guest_command_performed": false,
            "deployment_performed": false,
            "repair_performed": false,
            "cleanup_performed": false,
            "bounded_live_post_requests": 1,
            "bounded_live_post_attempts": 20
          }
          JSON

      - name: Verify published frontend configuration
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 45 \
            -D "$EVIDENCE_DIR/frontend-config-headers.txt" \
            "$FRONTEND_CONFIG_URL" \
            > "$EVIDENCE_DIR/frontend-report-source.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["EVIDENCE_DIR"])
          config = json.loads((root / "frontend-report-source.json").read_text(encoding="utf-8"))
          assert config["schema_version"] == "servicetracer.report-source.v1", config
          assert config["live_demo_api_url"] == os.environ["API_RUN_URL"], config
          assert config["candidate_demo_api_url"] == os.environ["API_RUN_URL"], config
          assert config["activation_status"] == "independent_demo_api_live_default_pending_github_pages_verification", config
          expected = config["expected_azure_host"]
          assert expected == {
              "resource_group": os.environ["EXPECTED_RESOURCE_GROUP"],
              "vm_name": os.environ["EXPECTED_VM_NAME"],
              "location": os.environ["EXPECTED_LOCATION"],
              "hosting_model": os.environ["EXPECTED_HOSTING_MODEL"],
          }, expected
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install bounded browser dependency
        run: npm install --no-save --no-package-lock puppeteer-core@24.16.0

      - name: Resolve hosted Chrome
        run: |
          set -euo pipefail
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          [[ -n "$chrome_path" ]] || {
            echo 'No supported Chrome or Chromium executable found on the hosted runner.' >&2
            exit 1
          }
          printf 'CHROME_PATH=%s\n' "$chrome_path" >> "$GITHUB_ENV"
          "$chrome_path" --version | tee "$EVIDENCE_DIR/chrome-version.txt"

      - name: Verify the real GitHub Pages browser path
        env:
          VERIFICATION_OUTPUT_DIR: ${{ env.EVIDENCE_DIR }}
        run: node scripts/verify_servicetracer_external_path.mjs

      - name: Verify disallowed browser origin fails closed
        run: |
          set -euo pipefail
          denied_status="$(
            curl --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              -X OPTIONS \
              -D "$EVIDENCE_DIR/denied-origin-headers.txt" \
              -o "$EVIDENCE_DIR/denied-origin.json" \
              -w '%{http_code}' \
              -H 'Origin: https://example.invalid' \
              -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: content-type,x-servicetracer-request-id' \
              "$API_RUN_URL"
          )"
          printf '%s\n' "$denied_status" > "$EVIDENCE_DIR/denied-origin-status.txt"
          [[ "$denied_status" == '403' ]]

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["EVIDENCE_DIR"])
          payload = json.loads((root / "denied-origin.json").read_text(encoding="utf-8"))
          assert payload == {"error": "origin_not_allowed"}, payload
          summary = {
              "status": "verified",
              "tested_origin": "https://example.invalid",
              "http_status": 403,
              "error": "origin_not_allowed",
              "azure_mutation_performed": False,
          }
          (root / "negative-cors-summary.json").write_text(
              json.dumps(summary, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Write portable evidence manifest
        if: always()
        run: |
          set -euo pipefail
          find "$EVIDENCE_DIR" -type f ! -name artifact-manifest.sha256 -printf '%P\0' \
            | sort -z \
            | while IFS= read -r -d '' relative; do
                sha256sum "$EVIDENCE_DIR/$relative" | sed "s#  $EVIDENCE_DIR/#  #"
              done > "$EVIDENCE_DIR/artifact-manifest.sha256"

      - name: Publish verification summary
        if: always()
        run: |
          {
            echo '## ServiceTracer external path verification'
            echo
            if [[ -f "$EVIDENCE_DIR/verification-summary.json" ]]; then
              echo '- GitHub Pages rendered the live console in hosted Chrome.'
              echo '- Browser health, CORS preflight, one 20-attempt POST, request correlation, and exact Azure runtime provenance passed.'
              echo '- Downstream transaction outcomes are evidence, not an exact root-cause claim.'
              echo '- No Azure login, Azure mutation, deployment, repair, rollback, or cleanup occurred.'
              echo
              echo '```json'
              cat "$EVIDENCE_DIR/verification-summary.json"
              echo '```'
            else
              echo '- Verification did not complete. Inspect the uploaded evidence without inferring service state from workflow failure alone.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload external-path evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: servicetracer-external-path-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
