name: ServiceTracer timeout fix deployment evidence promotion

on:
  pull_request:
    branches:
      - main
    paths:
      - .project/authorizations/servicetracer-demo-api-timeout-fix-deployment-20260724.json

permissions:
  actions: read
  contents: read

jobs:
  promote:
    name: Retrieve exact timeout fix deployment evidence
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
      SOURCE_BRANCH: agent/integrate-demo-api-frontend
      SOURCE_WORKFLOW: servicetracer-demo-api-timeout-fix-deploy.yml
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Retrieve source run, logs, and artifact
        run: |
          set -euo pipefail
          mkdir -p promoted-timeout-fix-deployment-evidence
          run_id=''
          status=''
          conclusion=''
          for _ in $(seq 1 360); do
            gh api -X GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${SOURCE_WORKFLOW}/runs" \
              -f branch="$SOURCE_BRANCH" \
              -f event=push \
              -F per_page=30 \
              > /tmp/deployment-runs.json
            run_id="$(jq -r --arg sha "$SOURCE_HEAD" '.workflow_runs | map(select(.head_sha == $sha)) | .[0].id // empty' /tmp/deployment-runs.json)"
            if [[ -n "$run_id" ]]; then
              status="$(jq -r --arg sha "$SOURCE_HEAD" '.workflow_runs | map(select(.head_sha == $sha)) | .[0].status' /tmp/deployment-runs.json)"
              conclusion="$(jq -r --arg sha "$SOURCE_HEAD" '.workflow_runs | map(select(.head_sha == $sha)) | .[0].conclusion // ""' /tmp/deployment-runs.json)"
              if [[ "$status" = completed ]]; then
                break
              fi
            fi
            sleep 8
          done
          test -n "$run_id"
          test "$status" = completed
          test "$conclusion" = success -o "$conclusion" = failure
          jq -n --argjson run_id "$run_id" --arg status "$status" --arg conclusion "$conclusion" --arg source_head "$SOURCE_HEAD" \
            '{source_run_id:$run_id,status:$status,conclusion:$conclusion,source_head:$source_head}' \
            > promoted-timeout-fix-deployment-evidence/source-run.json

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" \
            > promoted-timeout-fix-deployment-evidence/source-jobs.json
          job_id="$(jq -r '.jobs | map(select(.name == "Deploy exact timeout fix through existing VM extension")) | .[0].id // empty' promoted-timeout-fix-deployment-evidence/source-jobs.json)"
          if [[ -n "$job_id" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/logs" \
              > promoted-timeout-fix-deployment-evidence/source-job.log || true
          fi

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" > /tmp/deployment-artifacts.json
          artifact_id="$(jq -r '.artifacts | map(select(.name | startswith("servicetracer-demo-api-timeout-fix-deployment-"))) | .[0].id // empty' /tmp/deployment-artifacts.json)"
          test -n "$artifact_id"
          jq --argjson selected_artifact_id "$artifact_id" '. + {selected_artifact_id:$selected_artifact_id}' \
            /tmp/deployment-artifacts.json \
            > promoted-timeout-fix-deployment-evidence/source-artifacts.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/deployment-evidence.zip
          unzip -o /tmp/deployment-evidence.zip -d promoted-timeout-fix-deployment-evidence/artifact

      - name: Validate authority and outcome boundaries
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('promoted-timeout-fix-deployment-evidence')
          source = json.loads((root / 'source-run.json').read_text(encoding='utf-8'))
          artifact = root / 'artifact'
          summary_path = artifact / 'deployment-summary.json'
          assert summary_path.is_file(), 'deployment-summary.json'
          summary = json.loads(summary_path.read_text(encoding='utf-8'))
          assert summary['transaction_replay_performed'] is False
          assert (artifact / 'exact-head-ci.json').is_file()
          assert (artifact / 'what-if-assessment.json').is_file()
          assessment = json.loads((artifact / 'what-if-assessment.json').read_text(encoding='utf-8'))
          assert assessment['scope_escape_observed'] is False
          assert assessment['delete_or_replace_observed'] is False

          if source['conclusion'] == 'success':
              assert summary['status'] == 'deployed_and_health_verified', summary
              assert summary['corrected_health_contract_verified'] is True
              assert summary['resource_count_preserved'] == 7
              health = json.loads((artifact / 'health-after.json').read_text(encoding='utf-8'))
              assert health['backend_timeout_seconds'] == 10
              assert health['max_parallel_transactions'] == 10
              assert health['max_attempts'] == 50
              assert health['estimated_max_execution_seconds'] == 50
          else:
              assert summary['status'] == 'deployment_failed_or_unverified', summary
              assert summary['rollback_performed'] is True
          PY

      - name: Upload promoted deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: servicetracer-demo-api-timeout-fix-promoted-evidence
          path: promoted-timeout-fix-deployment-evidence/
          if-no-files-found: error
          retention-days: 90
