name: Azure AI go live run 8

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/azure-ai-go-live-run8.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-ai-go-live-run8
  cancel-in-progress: false

jobs:
  repaired-role-deploy-verify:
    name: Verify repaired role query, deploy model, and verify Azure AI run 8
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: azure-lab
    steps:
      - name: Check out exact merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate exact repository candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m unittest infra.tests.test_azure_ai_go_live_run8 -v
          bash -n scripts/azure_ai_go_live_run8.sh
          az bicep install
          az bicep lint --file infra/azure-ai-existing-account-model-only.bicep
          az bicep build --file infra/azure-ai-existing-account-model-only.bicep --outfile "$RUNNER_TEMP/azure-ai-existing-account-model-only.json"

      - name: Log in to Azure with workload identity federation
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Execute bounded repaired-role activation run 8
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_CORE_ONLY_SHOW_ERRORS: true
        run: bash scripts/azure_ai_go_live_run8.sh

      - name: Write evidence manifest
        if: always()
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/azure-ai-live-evidence"
          if [[ -d "$evidence" ]]; then
            find "$evidence" -type f ! -name manifest.sha256 -print0 \
              | sort -z \
              | xargs -0 -r sha256sum \
              | sed "s#${RUNNER_TEMP}/azure-ai-live-evidence/##g" \
              > "$evidence/manifest.sha256"
          fi

      - name: Upload protected run 8 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-ai-go-live-run8-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/azure-ai-live-evidence
          if-no-files-found: error
          retention-days: 30
