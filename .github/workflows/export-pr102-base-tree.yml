name: Export PR102 base tree

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/export-pr102-base-tree.yml

permissions:
  contents: read

jobs:
  export:
    name: Export exact head and tree SHA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Write Git object identities
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr102-git-object-identities
          git rev-parse HEAD > /tmp/pr102-git-object-identities/head-sha.txt
          git rev-parse 'HEAD^{tree}' > /tmp/pr102-git-object-identities/tree-sha.txt

      - name: Upload identities
        uses: actions/upload-artifact@v4
        with:
          name: pr102-git-object-identities-${{ github.run_id }}
          path: /tmp/pr102-git-object-identities
          if-no-files-found: error
          retention-days: 1
