permissions:
  contents: read
  id-token: none

jobs:
  validate:
    name: Validate Azure AI activation candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run deterministic boundary tests
        run: |
          python -m unittest infra.tests.test_openai_azure_foundry_provider -v
          python -m unittest infra.tests.test_azure_ai_live_activation -v
          python -m unittest infra.tests.test_azure_ai_go_live_run2 -v
          python -m unittest infra.tests.test_azure_ai_go_live_run3 -v
          python -m unittest infra.tests.test_azure_ai_go_live_run4 -v
          python -m unittest infra.tests.test_azure_ai_go_live_run5 -v
          python -m unittest infra.tests.test_azure_ai_go_live_run6 -v
          python -m unittest infra.tests.test_azure_ai_go_live_run7 -v
          python -m unittest infra.tests.test_azure_ai_go_live_run8 -v
          python -m unittest infra.tests.test_azure_ai_verified_runtime_wire -v
          python -m py_compile openai_azure_provider/client.py openai_azure_provider/invoke.py
          bash -n config/azure-openai-runtime.dev.sh
          bash -n scripts/azure_ai_go_live_run2.sh
          bash -n scripts/azure_ai_go_live_run3.sh
          bash -n scripts/azure_ai_go_live_run4.sh
          bash -n scripts/azure_ai_go_live_run5.sh
          bash -n scripts/azure_ai_go_live_run6.sh
          bash -n scripts/azure_ai_go_live_run7.sh
          bash -n scripts/azure_ai_go_live_run8.sh

      - name: Lint and build Azure AI Bicep
        uses: azure/CLI@v2
        with:
          inlineScript: |
            set -euo pipefail
            az bicep install
            az bicep version
            az bicep lint --file infra/azure-ai-live.bicep
            az bicep build --file infra/azure-ai-live.bicep --outfile /tmp/azure-ai-live.json
            az bicep lint --file infra/azure-ai-existing-account-adopt.bicep
            az bicep build --file infra/azure-ai-existing-account-adopt.bicep --outfile /tmp/azure-ai-existing-account-adopt.json
            az bicep lint --file infra/azure-ai-existing-account-model-only.bicep
            az bicep build --file infra/azure-ai-existing-account-model-only.bicep --outfile /tmp/azure-ai-existing-account-model-only.json
            az bicep lint --file infra/modules/azure_ai_openai.bicep
            az bicep build --file infra/modules/azure_ai_openai.bicep --outfile /tmp/azure-ai-openai-module.json
            az bicep build-params --file infra/azure-ai-live.dev.bicepparam --outfile /tmp/azure-ai-live.parameters.json
            jq -e '.parameters.deployAzureAi.value == false' /tmp/azure-ai-live.parameters.json >/dev/null
            jq -e '.parameters.assignInferenceRole.value == false' /tmp/azure-ai-live.parameters.json >/dev/null

      - name: Upload static validation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-ai-activation-static-validation
          path: |
            /tmp/azure-ai-live.json
            /tmp/azure-ai-existing-account-adopt.json
            /tmp/azure-ai-existing-account-model-only.json
            /tmp/azure-ai-openai-module.json
            /tmp/azure-ai-live.parameters.json
          if-no-files-found: warn
          retention-days: 14
