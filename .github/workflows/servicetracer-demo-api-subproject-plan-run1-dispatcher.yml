name: One-shot ServiceTracer dual-subscription planner run 1

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - '.project/triggers/servicetracer-demo-api-subproject-plan-run1.json'

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: one-shot-servicetracer-demo-api-subproject-plan-run1
  cancel-in-progress: false

env:
  REQUEST_FILE: .project/deployment-requests/servicetracer-demo-api-subproject-plan-run1.json
  TRIGGER_FILE: .project/triggers/servicetracer-demo-api-subproject-plan-run1.json
  ARTIFACT_DIR: servicetracer-demo-api-subproject-plan-run1-dispatcher-evidence
  GH_TOKEN: ${{ github.token }}

jobs:
  dispatch-observe-and-reconcile:
    name: Dispatch and observe one read-only planning run
    if: >-
      github.repository == 'anthonyedgar30000/azure-iac-msp-lab' &&
      github.event.action == 'opened' &&
      github.base_ref == 'main' &&
      github.head_ref == 'trigger/servicetracer-demo-api-subproject-plan-run1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out trigger context and complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate exact one-shot planning authority
        id: request
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$ARTIFACT_DIR"
          test -f "$REQUEST_FILE"
          test -f "$TRIGGER_FILE"

          jq -e '
            .schema_version == "project.servicetracer-demo-api-subproject-plan-trigger.v1" and
            .request_id == "servicetracer-demo-api-subproject-plan-run1" and
            .tracking_issue == 232 and
            .authorized_by == "user instruction: Proceed" and
            .dispatch_requested == true and
            .merge_authorized == false and
            .retry_authorized == false
          ' "$TRIGGER_FILE" >/dev/null

          jq -e '
            .schema_version == "project.servicetracer-demo-api-subproject-plan-request.v1" and
            .request_id == "servicetracer-demo-api-subproject-plan-run1" and
            .status == "authorized_unconsumed" and
            .tracking_issue == 232 and
            .authorized_by == "user instruction: Proceed" and
            .source.authorized_main == "1eca6b55e93d7276ada5fb06ffd8707d3895936a" and
            .source.binding_pull_request == 230 and
            .source.binding_ci.conclusion == "success" and
            .execution.workflow == ".github/workflows/servicetracer-demo-api-subproject-plan.yml" and
            .execution.dispatch_ref == "main" and
            .execution.environment == "dev" and
            .execution.location == "westus2" and
            .execution.prefix == "mst" and
            .execution.dependency_resource_group == "rg-servicetracer-dev-westus2" and
            .execution.target_resource_group == "rg-st-demo-api-dev-westus2" and
            .execution.dns_label == "st-demo-api-vm-aeg30000" and
            .execution.allowed_origin == "https://anthonyedgar30000.github.io" and
            .execution.vm_size == "Standard_F1als_v7" and
            .execution.maximum_monthly_cost_cad == 25 and
            .execution.confirmation == "PLAN-DEMO-API-SUBPROJECT:dev:st-demo-api-vm-aeg30000" and
            .authority.attempt_limit == 1 and
            .authority.renewable == false and
            .authority.transferable == false and
            .authority.dependency_subscription_read_only == true and
            .authority.target_subscription_planning_only == true and
            .authority.azure_authentication_and_queries_authorized == true and
            .authority.arm_validation_authorized == true and
            .authority.arm_what_if_authorized == true and
            .authority.provider_registration_authorized == false and
            .authority.credential_creation_authorized == false and
            .authority.azure_mutation_authorized == false and
            .authority.deployment_authorized == false and
            .authority.rbac_mutation_authorized == false and
            .authority.automatic_retry_authorized == false and
            .authority.manual_rerun_authorized == false and
            .authority.rollback_authorized == false and
            .authority.cleanup_authorized == false and
            .consumption.attempts_observed == 0 and
            .consumption.workflow_run_id == null
          ' "$REQUEST_FILE" >/dev/null

          valid_until="$(jq -r '.valid_until' "$REQUEST_FILE")"
          (( $(date -u +%s) <= $(date -u -d "$valid_until" +%s) ))

          git fetch origin main
          dispatcher_main_sha="$(git rev-parse origin/main)"
          authorized_main="$(jq -r '.source.authorized_main' "$REQUEST_FILE")"
          git cat-file -e "${authorized_main}^{commit}"
          git merge-base --is-ancestor "$authorized_main" "$dispatcher_main_sha"
          git cat-file -e "${dispatcher_main_sha}:.github/workflows/servicetracer-demo-api-subproject-plan.yml"
          git cat-file -e "${dispatcher_main_sha}:$REQUEST_FILE"
          git cat-file -e "${dispatcher_main_sha}:.github/workflows/servicetracer-demo-api-subproject-plan-run1-dispatcher.yml"

          cp "$REQUEST_FILE" "$ARTIFACT_DIR/request.json"
          cp "$TRIGGER_FILE" "$ARTIFACT_DIR/trigger.json"
          jq -n \
            --arg authorized_main "$authorized_main" \
            --arg dispatcher_main_sha "$dispatcher_main_sha" \
            --arg trigger_pr "${{ github.event.pull_request.number }}" \
            '{authorized_main:$authorized_main,dispatcher_main_sha:$dispatcher_main_sha,trigger_pr:($trigger_pr|tonumber),authority_consumed:false,azure_mutation_authorized:false,deployment_authorized:false}' \
            > "$ARTIFACT_DIR/authority-before-dispatch.json"

          echo "dispatcher_main_sha=$dispatcher_main_sha" >> "$GITHUB_OUTPUT"
          echo "tracker_issue=$(jq -r '.tracking_issue' "$REQUEST_FILE")" >> "$GITHUB_OUTPUT"
          echo "environment=$(jq -r '.execution.environment' "$REQUEST_FILE")" >> "$GITHUB_OUTPUT"
          echo "location=$(jq -r '.execution.location' "$REQUEST_FILE")" >> "$GITHUB_OUTPUT"
          echo "prefix=$(jq -r '.execution.prefix' "$REQUEST_FILE")" >> "$GITHUB_OUTPUT"
          echo "dependency_resource_group=$(jq -r '.execution.dependency_resource_group' "$REQUEST_FILE")" >> "$GITHUB_OUTPUT"
          echo "dns_label=$(jq -r '.execution.dns_label' "$REQUEST_FILE")" >> "$GITHUB_OUTPUT"
          echo "allowed_origin=$(jq -r '.execution.allowed_origin' "$REQUEST_FILE")" >> "$GITHUB_OUTPUT"
          echo "vm_size=$(jq -r '.execution.vm_size' "$REQUEST_FILE")" >> "$GITHUB_OUTPUT"
          echo "maximum_monthly_cost_cad=$(jq -r '.execution.maximum_monthly_cost_cad' "$REQUEST_FILE")" >> "$GITHUB_OUTPUT"
          echo "confirmation=$(jq -r '.execution.confirmation' "$REQUEST_FILE")" >> "$GITHUB_OUTPUT"

      - name: Dispatch the ratified planner once
        id: dispatch
        env:
          DISPATCHER_MAIN_SHA: ${{ steps.request.outputs.dispatcher_main_sha }}
          TRACKER_ISSUE: ${{ steps.request.outputs.tracker_issue }}
          LAB_ENVIRONMENT: ${{ steps.request.outputs.environment }}
          LOCATION: ${{ steps.request.outputs.location }}
          PREFIX: ${{ steps.request.outputs.prefix }}
          DEPENDENCY_RESOURCE_GROUP: ${{ steps.request.outputs.dependency_resource_group }}
          DNS_LABEL: ${{ steps.request.outputs.dns_label }}
          ALLOWED_ORIGIN: ${{ steps.request.outputs.allowed_origin }}
          VM_SIZE: ${{ steps.request.outputs.vm_size }}
          MAXIMUM_MONTHLY_COST_CAD: ${{ steps.request.outputs.maximum_monthly_cost_cad }}
          CONFIRMATION: ${{ steps.request.outputs.confirmation }}
        shell: bash
        run: |
          set -Eeuo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          gh workflow run servicetracer-demo-api-subproject-plan.yml \
            --ref main \
            -f environment="$LAB_ENVIRONMENT" \
            -f location="$LOCATION" \
            -f prefix="$PREFIX" \
            -f dependency_resource_group="$DEPENDENCY_RESOURCE_GROUP" \
            -f dns_label="$DNS_LABEL" \
            -f allowed_origin="$ALLOWED_ORIGIN" \
            -f vm_size="$VM_SIZE" \
            -f maximum_monthly_cost_cad="$MAXIMUM_MONTHLY_COST_CAD" \
            -f confirmation="$CONFIRMATION"

          jq -n \
            --arg accepted_at "$started_at" \
            --arg dispatcher_main_sha "$DISPATCHER_MAIN_SHA" \
            '{accepted_at:$accepted_at,dispatcher_main_sha:$dispatcher_main_sha,authority_consumed:true,retry_authorized:false,rollback_authorized:false,cleanup_authorized:false,azure_mutation_authorized:false,deployment_authorized:false}' \
            > "$ARTIFACT_DIR/dispatch-accepted.json"

          body=$(cat <<EOF
          ## ServiceTracer planner dispatch accepted

          The one-shot grant is now **consumed**, regardless of terminal outcome.

          - dispatcher main source: \`$DISPATCHER_MAIN_SHA\`
          - trigger PR: #${{ github.event.pull_request.number }}
          - accepted at: \`$started_at\`
          - operation: read-only dual-subscription planning, ARM validation, and bounded What-If
          - deployment authority: **false**
          - automatic retry: **not authorized**
          EOF
          )
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$TRACKER_ISSUE/comments" \
            -f body="$body" >/dev/null

          echo "started_at=$started_at" >> "$GITHUB_OUTPUT"

      - name: Locate, observe, and preserve the child planning run
        id: child
        env:
          STARTED_AT: ${{ steps.dispatch.outputs.started_at }}
          DISPATCHER_MAIN_SHA: ${{ steps.request.outputs.dispatcher_main_sha }}
          TRACKER_ISSUE: ${{ steps.request.outputs.tracker_issue }}
        shell: bash
        run: |
          set -Eeuo pipefail
          run_id=""
          for _ in $(seq 1 60); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/servicetracer-demo-api-subproject-plan.yml/runs?event=workflow_dispatch&branch=main&per_page=20")"
            run_id="$(jq -r \
              --arg started "$STARTED_AT" \
              --arg sha "$DISPATCHER_MAIN_SHA" \
              '[.workflow_runs[] | select(.created_at >= $started and .head_sha == $sha)] | sort_by(.created_at) | .[0].id // empty' \
              <<< "$runs")"
            [[ -n "$run_id" ]] && break
            sleep 5
          done
          [[ -n "$run_id" ]]

          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$TRACKER_ISSUE/comments" \
            -f body="Planning workflow located: [$run_id]($run_url). No second dispatch will be issued." \
            >/dev/null

          set +e
          gh run watch "$run_id" --interval 10
          watch_exit=$?
          set -e

          details="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts")"
          status="$(jq -r '.status' <<< "$details")"
          conclusion="$(jq -r '.conclusion // "not_completed"' <<< "$details")"
          head_sha="$(jq -r '.head_sha' <<< "$details")"
          artifact_summary="$(jq -c '[.artifacts[] | {id,name,size_in_bytes,digest,expired}]' <<< "$artifacts")"

          mkdir -p "$ARTIFACT_DIR/child"
          set +e
          gh run download "$run_id" --dir "$ARTIFACT_DIR/child"
          download_exit=$?
          set -e

          jq -n \
            --argjson run_id "$run_id" \
            --arg status "$status" \
            --arg conclusion "$conclusion" \
            --arg head_sha "$head_sha" \
            --arg url "$run_url" \
            --argjson watch_exit "$watch_exit" \
            --argjson download_exit "$download_exit" \
            --argjson artifacts "$artifact_summary" \
            '{run_id:$run_id,status:$status,conclusion:$conclusion,head_sha:$head_sha,url:$url,watch_exit:$watch_exit,artifact_download_exit:$download_exit,artifacts:$artifacts,authority_consumed:true,retry_authorized:false,azure_mutation_authorized:false,deployment_authorized:false}' \
            > "$ARTIFACT_DIR/child-terminal.json"

          body=$(cat <<EOF
          ## ServiceTracer planner terminal result

          - workflow: [$run_id]($run_url)
          - workflow head: \`$head_sha\`
          - status: **$status**
          - conclusion: **$conclusion**
          - artifacts: \`$artifact_summary\`
          - deployment authority: **false**
          - retry performed: **false**

          Protected evidence is preserved by the dispatcher. No Azure mutation, deployment, rollback, or cleanup was authorized.
          EOF
          )
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$TRACKER_ISSUE/comments" \
            -f body="$body" >/dev/null

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"

      - name: Write dispatcher evidence manifest
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$ARTIFACT_DIR"
          find "$ARTIFACT_DIR" -type f ! -name artifact-manifest.sha256 -print0 \
            | sort -z \
            | xargs -0 -r sha256sum \
            > "$ARTIFACT_DIR/artifact-manifest.sha256"

      - name: Upload one-shot dispatcher evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: servicetracer-demo-api-subproject-plan-run1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Enforce terminal child result after evidence upload
        if: always()
        env:
          CHILD_CONCLUSION: ${{ steps.child.outputs.conclusion }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$CHILD_CONCLUSION" == "success" ]]
