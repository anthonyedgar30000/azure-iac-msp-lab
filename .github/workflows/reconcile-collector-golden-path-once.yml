              "remaining_Azure_for_Students_credit": "not_observed",
              "actual_cost_cad": "not_observed",
              "cost_delta": "not_quantified",
          }
          api["source_binding"] = {
              "predeployment_plan_source": "8de1f61f8a0ea06dcf94b94c798edde2aace357d",
              "deployed_source": DEPLOYED_SOURCE,
              "current_main": MAIN,
              "current_main_deployed": False,
