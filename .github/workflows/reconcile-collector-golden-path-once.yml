          handoff = dedent(f"""
          # Current project handoff

          ## Interpretation boundary

          This handoff reflects GitHub state observed after PR #124 and durable Azure evidence from collector deployment run `{RUN_ID}`. It is not a continuously refreshed Azure dashboard.

          ```text
          declared_in_code != deployed_in_azure
          deployment_succeeded != service_validated
          workflow_failed != deployment_failed
          API_health_verified != downstream_transaction_success_verified
