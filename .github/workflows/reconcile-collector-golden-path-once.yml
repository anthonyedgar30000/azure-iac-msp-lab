          write_json(".project/current-reality-v2.json", current)

          gate = load(".project/lab-v1-completion-gate-v2.json")
          gate["recorded_at"] = now
          gate["decision_status"] = "collector_deployed_frontend_binding_reconciliation_pending"
          statuses = {
              "p0-exact-what-if-evidence": ("verified_run_30192970923_artifact_8629191915", True),
              "p0-source-and-cost-decision": ("deployment_source_resolved_to_98b0922_cost_not_observed", False),
              "p0-collector-deployment": ("deployed_run_30196388398_artifact_8630260279", True),
              "p0-runtime-contract": ("api_health_https_cors_and_20_request_verified_downstream_success_not_established", False),
              "p0-servicetracer-scenario": ("20_attempt_sample_preserved_no_stable_localization_no_unsupported_root_cause", False),
              "p0-browser-demonstration": ("previous_one_shot_consumed_before_browser_execution_new_grant_required", False),
              "p0-evidence-lock": ("deployment_and_api_evidence_locked_browser_cost_monitoring_pending", False),
          }
          for criterion in gate["p0"]["criteria"]:
              status, complete = statuses[criterion["criterion_id"]]
              criterion["current_status"] = status
              criterion["complete"] = complete
          gate["evidence_inputs"].update({
              "collector_deployment_record": ".project/reconciliations/collector-demo-api-deployment-run18-20260726.json",
              "workflow_run_id": RUN_ID,
              "artifact_id": ARTIFACT_ID,
              "deployed_source": DEPLOYED_SOURCE,
              "current_main": MAIN,
              "frontend_endpoint": COLLECTOR,
              "consumed_browser_pr": 123,
              "consumed_browser_run_id": FAILED_BROWSER_RUN,
          })
          gate["next_gate"] = {
              "operation": "publish_corrected_collector_binding_then_request_new_one_shot_browser_verification",
