name: Reconcile collector golden path once

on:
  push:
    branches:
      - agent/reconcile-collector-golden-path
    paths:
      - .github/workflows/reconcile-collector-golden-path-once.yml

permissions:
  contents: write

concurrency:
  group: reconcile-collector-golden-path-once
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref_name == 'agent/reconcile-collector-golden-path'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_MAIN: 50ae9113fafccbe31b3e2d076c021c814e4f446d
      BRANCH: agent/reconcile-collector-golden-path
    steps:
      - name: Check out exact reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Enforce repository-only scope and exact base
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$BRANCH"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git merge-base HEAD origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN"

      - name: Reconcile collector endpoint and canonical state
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from datetime import datetime
          from pathlib import Path
          from textwrap import dedent
          from zoneinfo import ZoneInfo

          OLD = "https://st-demo-api-vm-aeg30000.westus2.cloudapp.azure.com/api/demo/run"
          COLLECTOR = "https://st-demo-api-aeg30000.westus2.cloudapp.azure.com/api/demo/run"
          MAIN = "50ae9113fafccbe31b3e2d076c021c814e4f446d"
          SOURCE_HEAD = "dcfcc66f1ce9b2c49ffa5cbdca94c33d80716609"
          SOURCE_CI = 30201933461
          DEPLOYED_SOURCE = "98b092201053fd3592be157a24de6e623e6b74a6"
          RUN_ID = 30196388398
          RUN_NUMBER = 18
          JOB_ID = 89778570106
          ARTIFACT_ID = 8630260279
          ARTIFACT_DIGEST = "sha256:1f97be3c519d547871cc990e010013259dfd3c2e263f263653c2c4035340eb9e"
          FAILED_BROWSER_RUN = 30198346832
          now = datetime.now(ZoneInfo("America/Toronto")).replace(microsecond=0).isoformat()

          def load(path: str) -> dict:
              return json.loads(Path(path).read_text(encoding="utf-8"))

          def write_json(path: str, value: dict) -> None:
              Path(path).write_text(json.dumps(value, indent=2) + "\n", encoding="utf-8")

          def replace_exact(path: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if OLD not in text:
                  raise SystemExit(f"expected independent endpoint missing from {path}")
              target.write_text(text.replace(OLD, COLLECTOR), encoding="utf-8")

          for path in (
              ".project/validate.py",
              "infra/tests/test_frontend_api_demo_lab_integration.py",
              "infra/tests/test_frontend_live_default_activation.py",
              "scripts/verify_frontend_live_default.mjs",
              "docs/reviews/frontend-live-default-activation-20260726.md",
          ):
              replace_exact(path)

          activation_review = Path("docs/reviews/frontend-live-default-activation-20260726.md")
          review_text = activation_review.read_text(encoding="utf-8")
          if "## Collector binding reconciliation" not in review_text:
              review_text += dedent(
                  f"""

                  ## Collector binding reconciliation

                  The first activation revision accidentally used the independent VM API hostname even though its evidence anchor was collector deployment run `{RUN_ID}`. The current binding is corrected to the endpoint emitted by that deployment:

                  ```text
                  {COLLECTOR}
                  ```

                  The independent endpoint remains historical supporting evidence. It is not the Lab v1 golden path and cannot satisfy the collector-hosted browser gate.

                  ```text
                  independent_API_ready != collector_golden_path_verified
                  deployment_evidence_anchor != arbitrary_compatible_endpoint
                  ```
                  """
              )
          activation_review.write_text(review_text, encoding="utf-8")

          source = load("docs/report-source.json")
          source["live_demo_api_url"] = COLLECTOR
          source["candidate_demo_api_url"] = COLLECTOR
          source["activation_status"] = "collector_live_default_pending_github_pages_verification"
          source["evidence_anchor"] = ".project/reconciliations/collector-demo-api-deployment-run18-20260726.json"
          source["claim_boundary"] = (
              "The normal frontend is bound to the collector-hosted API deployed by run 30196388398. "
              "The controlled fixture remains the fail-closed fallback when health, CORS, or the live transaction request fails. "
              "Repository binding does not prove GitHub Pages publication or browser-path completion, and the independent VM API is not the collector golden path."
          )
          write_json("docs/report-source.json", source)

          # Update validator and tests for the more explicit activation state.
          for path in (
              ".project/validate.py",
              "infra/tests/test_frontend_api_demo_lab_integration.py",
              "infra/tests/test_frontend_live_default_activation.py",
              "scripts/verify_frontend_live_default.mjs",
          ):
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              text = text.replace(
                  "live_default_pending_github_pages_verification",
                  "collector_live_default_pending_github_pages_verification",
              )
              target.write_text(text, encoding="utf-8")

          index = load(".project/state-index.json")
          index["recorded_at"] = now
          write_json(".project/state-index.json", index)

          current = load(".project/current-reality-v2.json")
          current["recorded_at"] = now
          current["repository_state"] = {
              "default_branch": "main",
              "observed_head": MAIN,
              "latest_merged_pull_request": 124,
              "open_pull_requests_observed": [],
              "observation_boundary": "Observed after closing consumed PR #123 and before creating the reconciliation PR.",
              "exact_source_head": SOURCE_HEAD,
              "exact_source_ci_run_id": SOURCE_CI,
              "exact_source_ci_conclusion": "success",
              "merge_commit_ci": "not_observed",
              "local_working_tree": "not_observed",
          }
          current["evidence_anchors"].update({
              "run18_deployment": ".project/reconciliations/collector-demo-api-deployment-run18-20260726.json",
              "workflow_run_id": RUN_ID,
              "workflow_run_number": RUN_NUMBER,
              "workflow_job_id": JOB_ID,
              "artifact_id": ARTIFACT_ID,
              "artifact_digest": ARTIFACT_DIGEST,
              "artifact_manifest_payloads_verified": 48,
              "artifact_manifest_payload_failures": 0,
              "predeployment_what_if_run_id": 30192970923,
              "predeployment_what_if_artifact_id": 8629191915,
          })

          api = current["collector_demo_api"]
          api["observation"] = {
              "observed_at": "2026-07-26T09:26:57Z",
              "source": "verified_workflow_artifact",
              "subscription_name": "Azure for Students",
              "identity_identifiers": "sha256_fingerprints_only",
              "resource_group": "rg-servicetracer-dev-westus2",
              "location": "westus2",
              "reviewed_commit": DEPLOYED_SOURCE,
              "operation": "deploy",
              "azure_login_succeeded": True,
              "azure_mutation_performed": True,
          }
          api["predeployment_state"]["observation_boundary"] = "Historical run-16 state before deployment run 18."
          api["postdeployment_state"] = {
