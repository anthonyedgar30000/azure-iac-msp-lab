          }
          current["independent_demo_api"].update({
              "endpoint": OLD,
              "role": "historical_supporting_evidence_not_lab_v1_golden_path",
              "collector_golden_path": False,
          })
          for marker in (
              "workflow_failed != deployment_failed",
              "API_health_verified != downstream_transaction_success_verified",
              "independent_API_ready != collector_golden_path_verified",
              "frontend_bound != browser_verified",
          ):
              if marker not in current["canonical_distinctions"]:
                  current["canonical_distinctions"].append(marker)
          current["authority"].update({
              "pull_request_merge_authorized": False,
              "workflow_dispatch_authorized": False,
              "azure_authentication_authorized": False,
              "azure_query_authorized": False,
              "azure_mutation_authorized": False,
              "deployment_authorized": False,
              "verify_operation_authorized": False,
              "transaction_replay_authorized": False,
              "rollback_authorized": False,
              "cleanup_authorized": False,
              "rbac_mutation_authorized": False,
