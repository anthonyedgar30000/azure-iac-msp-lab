name: One-shot collector provenance preflight

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/collector-provenance-preflight-one-shot.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: collector-provenance-preflight-1677606d
  cancel-in-progress: false

env:
  TARGET_SOURCE: 1677606ded960c951fa37f0fdbfae50ba4b3cc34
  EXPECTED_BASE: 81156468a36d800595ec763ba54d954925fb3183
  RESOURCE_GROUP: rg-servicetracer-dev-westus2
  LOCATION: westus2
  PREFIX: mst
  LAB_ENVIRONMENT: dev
  DNS_LABEL: st-demo-api-aeg30000
  ALLOWED_ORIGIN: https://anthonyedgar30000.github.io
  ARTIFACT_DIR: collector-provenance-preflight-evidence

jobs:
  preflight:
    name: Read-only Azure state and FullResourcePayloads What-If
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: azure-lab
    timeout-minutes: 45
    steps:
      - name: Check out exact reviewed deployment source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SOURCE }}
          fetch-depth: 0

      - name: Validate exact source and bounded authority
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          [[ "$EVENT_BASE" == "$EXPECTED_BASE" ]]
          [[ "$(git rev-parse HEAD)" == "$TARGET_SOURCE" ]]
          git diff --quiet "$TARGET_SOURCE" "$EXPECTED_BASE"
          jq -n \
            --arg source "$TARGET_SOURCE" \
            --arg observed_main "$EXPECTED_BASE" \
            --arg resource_group "$RESOURCE_GROUP" \
            --arg location "$LOCATION" \
            '{schema_version:"servicetracer.provenance-preflight-request.v1",exact_source:$source,observed_main:$observed_main,resource_group:$resource_group,location:$location,azure_authentication_authorized:true,azure_query_authorized:true,arm_validation_authorized:true,what_if_authorized:true,azure_mutation_authorized:false,deployment_authorized:false,transaction_replay_authorized:false,browser_verification_authorized:false,rollback_authorized:false}' \
            > "$ARTIFACT_DIR/request.json"

      - name: Validate repository contracts before Azure login
        run: |
          set -euo pipefail
          python -m unittest \
            infra.tests.test_demo_backend_api \
            infra.tests.test_collector_demo_api \
            infra.tests.test_collector_demo_api_load_balancer \
            infra.tests.test_collector_demo_api_readiness \
            infra.tests.test_frontend_azure_provenance_monitor \
            infra.tests.test_frontend_live_default_activation \
            -v 2>&1 | tee "$ARTIFACT_DIR/repository-tests.log"

      - name: Log in to Azure using workload identity
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Capture live Azure state, quota, locks, dependencies, and cost
        run: |
          set -euo pipefail
          suffix="${PREFIX}-${LAB_ENVIRONMENT}"
          capture_json() {
            local output="$1"
            shift
            if "$@" --output json > "$output" 2>"${output}.stderr"; then
              rm -f "${output}.stderr"
              return 0
            fi
            jq -n --arg error "$(tr '\n' ' ' < "${output}.stderr" | head -c 1000)" '{status:"not_observed",error:$error}' > "$output"
            rm -f "${output}.stderr"
          }

          az account show --output json > "$ARTIFACT_DIR/azure-context-raw.json"
          subscription_id="$(jq -r '.id' "$ARTIFACT_DIR/azure-context-raw.json")"
          tenant_id="$(jq -r '.tenantId' "$ARTIFACT_DIR/azure-context-raw.json")"
          subscription_name="$(jq -r '.name' "$ARTIFACT_DIR/azure-context-raw.json")"
          jq -n \
            --arg subscription_name "$subscription_name" \
            --arg subscription_sha256 "$(printf '%s' "$subscription_id" | sha256sum | awk '{print $1}')" \
            --arg tenant_sha256 "$(printf '%s' "$tenant_id" | sha256sum | awk '{print $1}')" \
            '{subscription_name:$subscription_name,subscription_sha256:$subscription_sha256,tenant_sha256:$tenant_sha256}' \
            > "$ARTIFACT_DIR/azure-context.json"
          rm "$ARTIFACT_DIR/azure-context-raw.json"

          az group show --name "$RESOURCE_GROUP" --output json > "$ARTIFACT_DIR/resource-group.json"
          [[ "$(jq -r '.location' "$ARTIFACT_DIR/resource-group.json")" == "$LOCATION" ]]
          [[ "$(jq -r '.tags.workload // empty' "$ARTIFACT_DIR/resource-group.json")" == 'azure-iac-msp-lab' ]]

          az vm show --resource-group "$RESOURCE_GROUP" --name "vm-stcollector-${suffix}" --show-details --output json > "$ARTIFACT_DIR/collector-vm.json"
          az network nic show --resource-group "$RESOURCE_GROUP" --name "nic-stcollector-${suffix}" --output json > "$ARTIFACT_DIR/collector-nic.json"
          az network nsg show --resource-group "$RESOURCE_GROUP" --name "nsg-operations-${suffix}" --output json > "$ARTIFACT_DIR/operations-nsg.json"
          az network lb show --resource-group "$RESOURCE_GROUP" --name "lb-remote-access-${suffix}" --output json > "$ARTIFACT_DIR/edge-load-balancer.json"
          az network public-ip show --resource-group "$RESOURCE_GROUP" --name "pip-remote-access-${suffix}" --output json > "$ARTIFACT_DIR/remote-access-public-ip.json"
          az deployment group show --resource-group "$RESOURCE_GROUP" --name "operations-collector-${LAB_ENVIRONMENT}" --output json > "$ARTIFACT_DIR/collector-module-deployment.json"

          capture_json "$ARTIFACT_DIR/demo-api-public-ip.json" az network public-ip show --resource-group "$RESOURCE_GROUP" --name "pip-st-demo-api-${suffix}"
          capture_json "$ARTIFACT_DIR/demo-api-load-balancer.json" az network lb show --resource-group "$RESOURCE_GROUP" --name "lb-st-demo-api-${suffix}"
          capture_json "$ARTIFACT_DIR/demo-api-http-nsg-rule.json" az network nsg rule show --resource-group "$RESOURCE_GROUP" --nsg-name "nsg-operations-${suffix}" --name Allow-Demo-API-HTTP-From-Internet
          capture_json "$ARTIFACT_DIR/demo-api-https-nsg-rule.json" az network nsg rule show --resource-group "$RESOURCE_GROUP" --nsg-name "nsg-operations-${suffix}" --name Allow-Demo-API-HTTPS-From-Internet
          capture_json "$ARTIFACT_DIR/demo-api-vm-extension.json" az vm extension show --resource-group "$RESOURCE_GROUP" --vm-name "vm-stcollector-${suffix}" --name servicetracer-demo-api

          az network list-usages --location "$LOCATION" --output json > "$ARTIFACT_DIR/network-usage.json"
          az lock list --resource-group "$RESOURCE_GROUP" --output json > "$ARTIFACT_DIR/resource-locks.json"
          az resource list --resource-group "$RESOURCE_GROUP" --output json > "$ARTIFACT_DIR/resource-inventory.json"

          cat > "$ARTIFACT_DIR/cost-query-body.json" <<'JSON'
          {
            "type": "ActualCost",
            "timeframe": "MonthToDate",
            "dataset": {
              "granularity": "None",
              "aggregation": {
                "totalCost": {"name": "Cost", "function": "Sum"}
              }
            }
          }
          JSON
          if az rest \
            --method post \
            --url "https://management.azure.com/subscriptions/${subscription_id}/providers/Microsoft.CostManagement/query?api-version=2023-03-01" \
            --body @"$ARTIFACT_DIR/cost-query-body.json" \
            --output json > "$ARTIFACT_DIR/cost-month-to-date.json" 2>"$ARTIFACT_DIR/cost-query.stderr"; then
            rm -f "$ARTIFACT_DIR/cost-query.stderr"
          else
            jq -n --arg error "$(tr '\n' ' ' < "$ARTIFACT_DIR/cost-query.stderr" | head -c 1000)" '{status:"not_observed",error:$error}' > "$ARTIFACT_DIR/cost-month-to-date.json"
            rm -f "$ARTIFACT_DIR/cost-query.stderr"
          fi
          rm -f "$ARTIFACT_DIR/cost-query-body.json"

      - name: Enforce readiness and capture FullResourcePayloads What-If
        run: |
          set -euo pipefail
          suffix="${PREFIX}-${LAB_ENVIRONMENT}"
          collector_private_ip="$(jq -r '.ipConfigurations[0].privateIPAddress' "$ARTIFACT_DIR/collector-nic.json")"
          collector_subnet_id="$(jq -r '.ipConfigurations[0].subnet.id' "$ARTIFACT_DIR/collector-nic.json")"
          virtual_network_id="${collector_subnet_id%/subnets/*}"
          collector_vm_name="$(jq -r '.name' "$ARTIFACT_DIR/collector-vm.json")"
          operations_nsg_name="$(jq -r '.name' "$ARTIFACT_DIR/operations-nsg.json")"
          remote_access_load_balancer_name="$(jq -r '.name' "$ARTIFACT_DIR/edge-load-balancer.json")"
          remote_access_ip="$(jq -r '.ipAddress' "$ARTIFACT_DIR/remote-access-public-ip.json")"
          collector_source_repository="$(jq -r '.properties.parameters.collectorSourceRepository.value' "$ARTIFACT_DIR/collector-module-deployment.json")"
          existing_collector_source_ref="$(jq -r '.properties.parameters.collectorSourceRef.value' "$ARTIFACT_DIR/collector-module-deployment.json")"
          backend_transaction_url="https://${remote_access_ip}/transaction"
          installer_uri="https://raw.githubusercontent.com/anthonyedgar30000/azure-iac-msp-lab/${TARGET_SOURCE}/infra/scripts/install_collector_demo_api.sh"

          jq -n \
            --arg collector_private_ip "$collector_private_ip" \
            --arg virtual_network_id "$virtual_network_id" \
            --arg collector_vm_name "$collector_vm_name" \
            --arg operations_nsg_name "$operations_nsg_name" \
            --arg remote_access_load_balancer_name "$remote_access_load_balancer_name" \
            --arg backend_transaction_url "$backend_transaction_url" \
            --arg collector_source_repository "$collector_source_repository" \
            --arg existing_collector_source_ref "$existing_collector_source_ref" \
            --arg deployment_source_ref "$TARGET_SOURCE" \
            --arg installer_uri "$installer_uri" \
            '{collector_private_ip:$collector_private_ip,virtual_network_id:$virtual_network_id,collector_vm_name:$collector_vm_name,operations_nsg_name:$operations_nsg_name,remote_access_load_balancer_name:$remote_access_load_balancer_name,backend_transaction_url:$backend_transaction_url,collector_source_repository:$collector_source_repository,existing_collector_source_ref:$existing_collector_source_ref,deployment_source_ref:$deployment_source_ref,installer_uri:$installer_uri}' \
            > "$ARTIFACT_DIR/effective-collector-parameters.json"

          jq -n --arg status "$(jq -r 'if .status=="not_observed" then "not_present" else "observed_existing" end' "$ARTIFACT_DIR/demo-api-public-ip.json")" '{status:$status}' > "$ARTIFACT_DIR/demo-api-public-ip-state.json"
          jq -n \
            --arg frontend "not_present" \
            --arg backend_pool "not_present" \
            --arg probe "not_present" \
            --arg http_rule "not_present" \
            --arg https_rule "not_present" \
            --arg public_ip "$(jq -r '.status' "$ARTIFACT_DIR/demo-api-public-ip-state.json")" \
            --arg load_balancer "$(jq -r 'if .status=="not_observed" then "not_present" else "observed_existing" end' "$ARTIFACT_DIR/demo-api-load-balancer.json")" \
            --arg http_nsg_rule "$(jq -r 'if .status=="not_observed" then "not_present" else "observed_existing" end' "$ARTIFACT_DIR/demo-api-http-nsg-rule.json")" \
            --arg https_nsg_rule "$(jq -r 'if .status=="not_observed" then "not_present" else "observed_existing" end' "$ARTIFACT_DIR/demo-api-https-nsg-rule.json")" \
            --arg vm_extension "$(jq -r 'if .status=="not_observed" then "not_present" else "observed_existing" end' "$ARTIFACT_DIR/demo-api-vm-extension.json")" \
            '{schema_version:"servicetracer.collector-demo-api-ingress-state.v1",legacy_remote_load_balancer_children:{frontend:$frontend,backend_pool:$backend_pool,probe:$probe,http_rule:$http_rule,https_rule:$https_rule},dedicated_target_resources:{public_ip:$public_ip,load_balancer:$load_balancer,http_nsg_rule:$http_nsg_rule,https_nsg_rule:$https_nsg_rule,vm_extension:$vm_extension}}' \
            > "$ARTIFACT_DIR/collector-demo-api-ingress-state.json"

          python infra/scripts/assess_collector_demo_api_readiness.py \
            --collector-vm "$ARTIFACT_DIR/collector-vm.json" \
            --collector-nic "$ARTIFACT_DIR/collector-nic.json" \
            --collector-module-deployment "$ARTIFACT_DIR/collector-module-deployment.json" \
            --network-usage "$ARTIFACT_DIR/network-usage.json" \
            --resource-locks "$ARTIFACT_DIR/resource-locks.json" \
            --demo-api-public-ip-state "$ARTIFACT_DIR/demo-api-public-ip-state.json" \
            --prior-demo-api-resources "$ARTIFACT_DIR/resource-inventory.json" \
            --ingress-state "$ARTIFACT_DIR/collector-demo-api-ingress-state.json" \
            --dns-label "$DNS_LABEL" \
            --location "$LOCATION" \
            --expected-private-ip '10.20.40.10' \
            --output "$ARTIFACT_DIR/readiness-assessment.json"
          jq -e '.deployment_decision_ready==true and .public_ip_quota.sufficient==true' "$ARTIFACT_DIR/readiness-assessment.json" > /dev/null

          parameters=(
            prefix="$PREFIX"
            environment="$LAB_ENVIRONMENT"
            location="$LOCATION"
            virtualNetworkId="$virtual_network_id"
            operationsNsgName="$operations_nsg_name"
            collectorVmName="$collector_vm_name"
            collectorPrivateIpAddress="$collector_private_ip"
            dnsLabel="$DNS_LABEL"
            allowedOrigin="$ALLOWED_ORIGIN"
            backendTransactionUrl="$backend_transaction_url"
            sourceRepository="$collector_source_repository"
            sourceRef="$TARGET_SOURCE"
            installerUri="$installer_uri"
          )

          az deployment group validate \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/collector-demo-api.bicep \
            --parameters "${parameters[@]}" \
            --output json > "$ARTIFACT_DIR/arm-validation.json"

          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/collector-demo-api.bicep \
            --parameters "${parameters[@]}" \
            --result-format FullResourcePayloads \
            --no-pretty-print \
            --output json > "$ARTIFACT_DIR/arm-what-if.json"

          python infra/scripts/assert_collector_demo_api_what_if.py \
            --input "$ARTIFACT_DIR/arm-what-if.json" \
            --output "$ARTIFACT_DIR/what-if-assessment.json" \
            --suffix "$suffix" \
            --private-ip "$collector_private_ip" \
            --virtual-network-id "$virtual_network_id" \
            --dns-label "$DNS_LABEL"

      - name: Sanitize identifiers and write evidence manifest
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          subscription_id="${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          tenant_id="${{ secrets.AZURE_TENANT_ID }}"
          if [[ -n "$subscription_id" ]]; then
            find "$ARTIFACT_DIR" -type f -print0 | xargs -0 -r sed -i "s/${subscription_id}/<redacted-subscription>/g"
          fi
          if [[ -n "$tenant_id" ]]; then
            find "$ARTIFACT_DIR" -type f -print0 | xargs -0 -r sed -i "s/${tenant_id}/<redacted-tenant>/g"
          fi
          find "$ARTIFACT_DIR" -maxdepth 1 -type f ! -name evidence-manifest.json ! -name sha256sums.txt -print0 \
            | sort -z | xargs -0 -r sha256sum > "$ARTIFACT_DIR/sha256sums.txt"
          jq -n \
            --arg exact_source "$TARGET_SOURCE" \
            --arg observed_main "$EXPECTED_BASE" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --rawfile sums "$ARTIFACT_DIR/sha256sums.txt" \
            '{schema_version:"servicetracer.provenance-preflight-evidence.v1",exact_source:$exact_source,observed_main:$observed_main,operation:"read_only_state_and_what_if",run_id:$run_id,generated_at:$generated_at,azure_mutation_performed:false,deployment_performed:false,transaction_replay_performed:false,browser_verification_performed:false,sha256sums:$sums}' \
            > "$ARTIFACT_DIR/evidence-manifest.json"

      - name: Upload bounded preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collector-provenance-preflight-${{ github.run_id }}
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 30
