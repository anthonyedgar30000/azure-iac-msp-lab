name: Frontend live candidate evidence promotion

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/frontend-live-candidate-evidence-promote.yml

permissions:
  actions: read
  contents: read

jobs:
  promote-evidence:
    name: Retrieve and validate bounded browser evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_HEAD: a9c7f4f1826b1cf2a8944a3a7575f07ce54f9d1b
      SOURCE_WORKFLOW: frontend-live-candidate-verify.yml
      SOURCE_BRANCH: agent/integrate-demo-api-frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Retrieve exact browser run, logs, and artifact
        run: |
          set -euo pipefail
          mkdir -p promoted-browser-evidence

          RUN_ID=''
          STATUS=''
          CONCLUSION=''
          for _ in $(seq 1 60); do
            gh api -X GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${SOURCE_WORKFLOW}/runs" \
              -f branch="${SOURCE_BRANCH}" \
              -f event=push \
              -F per_page=20 \
              > /tmp/frontend-live-candidate-runs.json
            RUN_ID="$(jq -r --arg sha "$SOURCE_HEAD" '.workflow_runs | map(select(.head_sha == $sha)) | .[0].id // empty' /tmp/frontend-live-candidate-runs.json)"
            if [[ -n "$RUN_ID" ]]; then
              STATUS="$(jq -r --arg sha "$SOURCE_HEAD" '.workflow_runs | map(select(.head_sha == $sha)) | .[0].status' /tmp/frontend-live-candidate-runs.json)"
              CONCLUSION="$(jq -r --arg sha "$SOURCE_HEAD" '.workflow_runs | map(select(.head_sha == $sha)) | .[0].conclusion // ""' /tmp/frontend-live-candidate-runs.json)"
              if [[ "$STATUS" == 'completed' ]]; then
                break
              fi
            fi
            sleep 5
          done

          test -n "$RUN_ID"
          test "$STATUS" = 'completed'
          jq --argjson run_id "$RUN_ID" --arg status "$STATUS" --arg conclusion "$CONCLUSION" \
            '{source_run_id: $run_id, status: $status, conclusion: $conclusion}' \
            /tmp/frontend-live-candidate-runs.json \
            > promoted-browser-evidence/source-run.json

          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs" \
            > promoted-browser-evidence/source-jobs.json
          JOB_ID="$(jq -r '.jobs | map(select(.name == "Browser, CORS, and live transaction evidence")) | .[0].id // empty' promoted-browser-evidence/source-jobs.json)"
          if [[ -n "$JOB_ID" ]]; then
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}/logs" \
              > promoted-browser-evidence/source-job.log || true
          fi

          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
            > /tmp/frontend-live-candidate-artifacts.json
          ARTIFACT_ID="$(jq -r '.artifacts | map(select(.name == "frontend-live-candidate-browser-evidence")) | .[0].id // empty' /tmp/frontend-live-candidate-artifacts.json)"
          if [[ -n "$ARTIFACT_ID" ]]; then
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
              > /tmp/frontend-live-candidate-browser-evidence.zip
            unzip -o /tmp/frontend-live-candidate-browser-evidence.zip \
              -d promoted-browser-evidence/artifact
          fi

      - name: Validate promoted browser evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('promoted-browser-evidence')
          source = json.loads((root / 'source-run.json').read_text(encoding='utf-8'))
          if source['conclusion'] != 'success':
              raise SystemExit(f"browser verification run concluded {source['conclusion']!r}")

          candidates = list(root.glob('artifact/**/frontend-live-candidate-verification.json'))
          if len(candidates) != 1:
              raise SystemExit(f'expected one browser evidence JSON, found {len(candidates)}')
          evidence = json.loads(candidates[0].read_text(encoding='utf-8'))
          assert evidence['schema_version'] == 'project.frontend-live-candidate-browser-verification.v1'
          assert evidence['repository_sha'] == 'a9c7f4f1826b1cf2a8944a3a7575f07ce54f9d1b'
          assert evidence['health']['status'] == 200
          assert evidence['cors_preflight']['status'] == 204
          assert evidence['transaction_run']['status'] == 200
          assert evidence['transaction_run']['attempts'] == 20
          assert evidence['frontend']['fixture_fallback_used'] is False
          assert evidence['actual_github_pages_deployment_verified'] is False
          PY

      - name: Upload promoted browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-live-candidate-promoted-evidence
          path: promoted-browser-evidence/
          if-no-files-found: error
          retention-days: 90
