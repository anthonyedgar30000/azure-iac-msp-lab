name: One-shot correlation identity deployment run 1

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - '.project/triggers/correlation-identity-deploy-run1.json'

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: one-shot-correlation-identity-deploy-run1
  cancel-in-progress: false

env:
  REQUEST_FILE: .project/deployment-requests/correlation-identity-run1.json
  TRIGGER_FILE: .project/triggers/correlation-identity-deploy-run1.json
  ARTIFACT_DIR: correlation-identity-run1-evidence
  GH_TOKEN: ${{ github.token }}

jobs:
  dispatch-observe-and-verify:
    name: Deploy and verify exact correlation identity fix
    if: >-
      github.repository == 'anthonyedgar30000/azure-iac-msp-lab' &&
      github.event.action == 'opened' &&
      github.base_ref == 'main' &&
      github.head_ref == 'trigger/correlation-identity-deploy-run1'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out trigger context and complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate exact one-shot authority and source
        id: request
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$ARTIFACT_DIR"
          test -f "$REQUEST_FILE"
          test -f "$TRIGGER_FILE"

          jq -e '
            .schema_version == "project.correlation-identity-trigger.v1" and
            .request_id == "correlation-identity-run1" and
            .tracking_issue == 179 and
            .authorized_by == "user instruction: Stop being so perfect just fix the remaining issue" and
            .dispatch_requested == true and
            .merge_authorized == false and
            .retry_authorized == false
          ' "$TRIGGER_FILE" > /dev/null

          jq -e '
            .schema_version == "project.correlation-identity-deployment-request.v1" and
            .request_id == "correlation-identity-run1" and
            .status == "authorized_unconsumed" and
            .tracking_issue == 179 and
            .source.repair_pull_request == 178 and
            .source.exact_head == "0b6b5322f25b3d0289f6c0febdcfd800ea4b909a" and
            .source.merge_commit == "e2b0aee4c4f9e0042036042d7892b7d51ec17e2e" and
            .source.ci_run_id == 30309238071 and
            .source.ci_conclusion == "success" and
            .execution.workflow == ".github/workflows/collector-demo-api.yml" and
            .execution.dispatch_ref == "main" and
            .execution.operation == "deploy" and
            .execution.reviewed_commit == "0b6b5322f25b3d0289f6c0febdcfd800ea4b909a" and
            .execution.environment == "dev" and
            .execution.resource_group == "rg-servicetracer-dev-westus2" and
            .execution.location == "westus2" and
            .execution.prefix == "mst" and
            .execution.dns_label == "st-demo-api-aeg30000" and
            .execution.allowed_origin == "https://anthonyedgar30000.github.io" and
            .execution.confirmation == "COLLECTOR-DEMO-API:deploy:rg-servicetracer-dev-westus2:st-demo-api-aeg30000" and
            .authority.attempt_limit == 1 and
            .authority.renewable == false and
            .authority.transferable == false and
            .authority.automatic_retry_authorized == false and
            .authority.rollback_authorized == false and
            .authorized_mutation_scope.creates == 0 and
            .authorized_mutation_scope.deletes == 0 and
            .authorized_mutation_scope.replaces == 0 and
            (.authorized_mutation_scope.modifies | length) == 3 and
            .post_deployment_verification.health_requests == 12 and
            .post_deployment_verification.transaction_attempts == 20 and
            .post_deployment_verification.request_header_identity_required == true and
            .post_deployment_verification.request_body_identity_required == true and
            .post_deployment_verification.hosting_model_required == "collector_vm_systemd"
          ' "$REQUEST_FILE" > /dev/null

          valid_until="$(jq -r '.valid_until' "$REQUEST_FILE")"
          (( $(date -u +%s) <= $(date -u -d "$valid_until" +%s) ))

          git fetch origin main
          dispatcher_main_sha="$(git rev-parse origin/main)"
          reviewed_commit="$(jq -r '.execution.reviewed_commit' "$REQUEST_FILE")"
          git cat-file -e "${reviewed_commit}^{commit}"
          git merge-base --is-ancestor "$reviewed_commit" "$dispatcher_main_sha"
          git cat-file -e "${dispatcher_main_sha}:.github/workflows/correlation-identity-deploy-run1.yml"
          git cat-file -e "${dispatcher_main_sha}:$REQUEST_FILE"

          cp "$REQUEST_FILE" "$ARTIFACT_DIR/deployment-request.json"
          cp "$TRIGGER_FILE" "$ARTIFACT_DIR/trigger.json"
          printf '%s\n' \
            "reviewed_commit=$reviewed_commit" \
            "dispatcher_main_sha=$dispatcher_main_sha" \
            "trigger_pr=${{ github.event.pull_request.number }}" \
            "event_action=${{ github.event.action }}" \
            > "$ARTIFACT_DIR/authority.txt"

          echo "reviewed_commit=$reviewed_commit" >> "$GITHUB_OUTPUT"
          echo "dispatcher_main_sha=$dispatcher_main_sha" >> "$GITHUB_OUTPUT"
          echo "tracker_issue=$(jq -r '.tracking_issue' "$REQUEST_FILE")" >> "$GITHUB_OUTPUT"
          echo "environment=$(jq -r '.execution.environment' "$REQUEST_FILE")" >> "$GITHUB_OUTPUT"
          echo "resource_group=$(jq -r '.execution.resource_group' "$REQUEST_FILE")" >> "$GITHUB_OUTPUT"
          echo "location=$(jq -r '.execution.location' "$REQUEST_FILE")" >> "$GITHUB_OUTPUT"
          echo "prefix=$(jq -r '.execution.prefix' "$REQUEST_FILE")" >> "$GITHUB_OUTPUT"
          echo "dns_label=$(jq -r '.execution.dns_label' "$REQUEST_FILE")" >> "$GITHUB_OUTPUT"
          echo "allowed_origin=$(jq -r '.execution.allowed_origin' "$REQUEST_FILE")" >> "$GITHUB_OUTPUT"
          echo "confirmation=$(jq -r '.execution.confirmation' "$REQUEST_FILE")" >> "$GITHUB_OUTPUT"

      - name: Dispatch the governed collector deployment once
        id: dispatch
        env:
          REVIEWED_COMMIT: ${{ steps.request.outputs.reviewed_commit }}
          DISPATCHER_MAIN_SHA: ${{ steps.request.outputs.dispatcher_main_sha }}
          TRACKER_ISSUE: ${{ steps.request.outputs.tracker_issue }}
          LAB_ENVIRONMENT: ${{ steps.request.outputs.environment }}
          RESOURCE_GROUP: ${{ steps.request.outputs.resource_group }}
          LOCATION: ${{ steps.request.outputs.location }}
          PREFIX: ${{ steps.request.outputs.prefix }}
          DNS_LABEL: ${{ steps.request.outputs.dns_label }}
          ALLOWED_ORIGIN: ${{ steps.request.outputs.allowed_origin }}
          CONFIRMATION: ${{ steps.request.outputs.confirmation }}
        shell: bash
        run: |
          set -Eeuo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          gh workflow run collector-demo-api.yml \
            --ref main \
            -f operation=deploy \
            -f reviewed_commit="$REVIEWED_COMMIT" \
            -f environment="$LAB_ENVIRONMENT" \
            -f resource_group="$RESOURCE_GROUP" \
            -f location="$LOCATION" \
            -f prefix="$PREFIX" \
            -f dns_label="$DNS_LABEL" \
            -f allowed_origin="$ALLOWED_ORIGIN" \
            -f confirmation="$CONFIRMATION"

          body=$(cat <<EOF
          ## Correlation identity deployment dispatch accepted

          The one-shot grant is now **consumed**, regardless of terminal outcome.

          - reviewed source: \`$REVIEWED_COMMIT\`
          - dispatcher main source: \`$DISPATCHER_MAIN_SHA\`
          - trigger PR: #${{ github.event.pull_request.number }}
          - accepted at: \`$started_at\`
          - automatic retry: **not authorized**
          - automatic rollback: **not authorized**
          EOF
          )
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$TRACKER_ISSUE/comments" \
            -f body="$body" > /dev/null

          echo "started_at=$started_at" >> "$GITHUB_OUTPUT"

      - name: Locate and observe the exact deployment run
        id: deployment
        env:
          STARTED_AT: ${{ steps.dispatch.outputs.started_at }}
          DISPATCHER_MAIN_SHA: ${{ steps.request.outputs.dispatcher_main_sha }}
          TRACKER_ISSUE: ${{ steps.request.outputs.tracker_issue }}
          REVIEWED_COMMIT: ${{ steps.request.outputs.reviewed_commit }}
        shell: bash
        run: |
          set -Eeuo pipefail
          run_id=""
          for _ in $(seq 1 60); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/collector-demo-api.yml/runs?event=workflow_dispatch&branch=main&per_page=20")"
            run_id="$(jq -r \
              --arg started "$STARTED_AT" \
              --arg sha "$DISPATCHER_MAIN_SHA" \
              '[.workflow_runs[] | select(.created_at >= $started and .head_sha == $sha)] | sort_by(.created_at) | .[0].id // empty' \
              <<< "$runs")"
            [[ -n "$run_id" ]] && break
            sleep 5
          done
          [[ -n "$run_id" ]]

          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$TRACKER_ISSUE/comments" \
            -f body="Deployment workflow located: [$run_id]($run_url). No second dispatch will be issued." \
            > /dev/null

          gh run watch "$run_id" --interval 10

          details="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts")"
          status="$(jq -r '.status' <<< "$details")"
          conclusion="$(jq -r '.conclusion // "not_completed"' <<< "$details")"
          head_sha="$(jq -r '.head_sha' <<< "$details")"
          run_html_url="$(jq -r '.html_url' <<< "$details")"
          artifact_summary="$(jq -c '[.artifacts[] | {id,name,size_in_bytes,digest,expired}]' <<< "$artifacts")"

          jq -n \
            --argjson run_id "$run_id" \
            --arg status "$status" \
            --arg conclusion "$conclusion" \
            --arg head_sha "$head_sha" \
            --arg reviewed_commit "$REVIEWED_COMMIT" \
            --arg url "$run_html_url" \
            --argjson artifacts "$artifact_summary" \
            '{run_id:$run_id,status:$status,conclusion:$conclusion,head_sha:$head_sha,reviewed_commit:$reviewed_commit,url:$url,artifacts:$artifacts}' \
            > "$ARTIFACT_DIR/deployment-terminal.json"

          body=$(cat <<EOF
          ## Correlation identity deployment workflow terminal result

          - workflow: [$run_id]($run_html_url)
          - workflow head: \`$head_sha\`
          - reviewed deployment source: \`$REVIEWED_COMMIT\`
          - status: **$status**
          - child workflow conclusion: **$conclusion**
          - artifacts: \`$artifact_summary\`

          Independent source-bound live verification follows. No retry or rollback was performed.
          EOF
          )
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$TRACKER_ISSUE/comments" \
            -f body="$body" > /dev/null

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"

      - name: Independently verify deployed source and correlation contract
        env:
          REVIEWED_COMMIT: ${{ steps.request.outputs.reviewed_commit }}
          TRACKER_ISSUE: ${{ steps.request.outputs.tracker_issue }}
          ALLOWED_ORIGIN: ${{ steps.request.outputs.allowed_origin }}
          CHILD_CONCLUSION: ${{ steps.deployment.outputs.conclusion }}
        shell: bash
        run: |
          set -Eeuo pipefail
          health_url='https://st-demo-api-aeg30000.westus2.cloudapp.azure.com/api/health'
          run_url='https://st-demo-api-aeg30000.westus2.cloudapp.azure.com/api/demo/run'

          source_ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error \
              --connect-timeout 5 --max-time 15 \
              "$health_url" > "$ARTIFACT_DIR/source-readiness.json"; then
              observed_source="$(jq -r '.azure_host.source_ref // empty' "$ARTIFACT_DIR/source-readiness.json")"
              if [[ "$observed_source" == "$REVIEWED_COMMIT" ]]; then
                source_ready=true
                break
              fi
            fi
            sleep 10
          done
          [[ "$source_ready" == true ]]

          for attempt in $(seq 1 12); do
            curl --fail --silent --show-error \
              --connect-timeout 5 --max-time 15 \
              "$health_url" > "$ARTIFACT_DIR/health-${attempt}.json"
          done

          request_id="$(python - <<'PY'
          import uuid
          print(uuid.uuid4())
          PY
          )"

          preflight_status="$(curl --silent --show-error \
            --request OPTIONS \
            --header "Origin: $ALLOWED_ORIGIN" \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: Content-Type, X-ServiceTracer-Request-ID' \
            --dump-header "$ARTIFACT_DIR/preflight-headers.txt" \
            --output /dev/null \
            --write-out '%{http_code}' \
            "$run_url")"
          [[ "$preflight_status" == '204' ]]

          post_status="$(curl --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --header "Origin: $ALLOWED_ORIGIN" \
            --header "X-ServiceTracer-Request-ID: $request_id" \
            --data '{"attempts":20}' \
            --dump-header "$ARTIFACT_DIR/post-headers.txt" \
            --output "$ARTIFACT_DIR/post-response.json" \
            --write-out '%{http_code}' \
            --max-time 90 \
            "$run_url")"
          [[ "$post_status" == '200' ]]

          python - "$ALLOWED_ORIGIN" "$request_id" "$REVIEWED_COMMIT" "$ARTIFACT_DIR" <<'PY'
          import json
          import sys
          from pathlib import Path

          origin, request_id, reviewed_commit, artifact_dir = sys.argv[1:]
          root = Path(artifact_dir)

          def headers(path: Path) -> dict[str, str]:
              parsed: dict[str, str] = {}
              for line in path.read_bytes().decode('iso-8859-1').splitlines():
                  if ':' not in line:
                      continue
                  name, value = line.split(':', 1)
                  parsed[name.strip().lower()] = value.strip()
              return parsed

          for health_path in sorted(root.glob('health-*.json')):
              payload = json.loads(health_path.read_text(encoding='utf-8'))
              assert payload['status'] == 'healthy'
              assert payload['backend_target_configured'] is True
              assert payload['hosting_model'] == 'collector_vm_systemd'
              identity = payload['azure_host']
              assert identity['verified'] is True
              assert identity['resource_group'] == 'rg-servicetracer-dev-westus2'
              assert identity['vm_name'] == 'vm-stcollector-mst-dev'
              assert identity['location'] == 'westus2'
              assert identity['source_ref'] == reviewed_commit

          preflight = headers(root / 'preflight-headers.txt')
          assert preflight['access-control-allow-origin'] == origin
          assert 'POST' in preflight['access-control-allow-methods']
          assert 'x-servicetracer-request-id' in preflight['access-control-allow-headers'].lower()
          assert 'x-servicetracer-request-id' in preflight['access-control-expose-headers'].lower()

          post_headers = headers(root / 'post-headers.txt')
          payload = json.loads((root / 'post-response.json').read_text(encoding='utf-8'))
          assert post_headers['access-control-allow-origin'] == origin
          assert post_headers['x-servicetracer-request-id'] == request_id
          assert payload['request_id'] == request_id
          assert payload['hosting_model'] == 'collector_vm_systemd'
          assert payload['schema_version'] == 'servicetracer.demo-api-response.v1'
          assert len(payload['transactions']) == 20
          assert payload['azure_host']['verified'] is True
          assert payload['azure_host']['resource_group'] == 'rg-servicetracer-dev-westus2'
          assert payload['azure_host']['vm_name'] == 'vm-stcollector-mst-dev'
          assert payload['azure_host']['location'] == 'westus2'
          assert payload['azure_host']['source_ref'] == reviewed_commit
          assert payload['report']['investigation_boundary']['exact_root_cause_claimed'] is False
          PY

          pages_ready=false
          for _ in $(seq 1 36); do
            curl --fail --silent --show-error \
              "https://anthonyedgar30000.github.io/live-monitor.js?source=$REVIEWED_COMMIT" \
              > "$ARTIFACT_DIR/pages-live-monitor.js"
            curl --fail --silent --show-error \
              "https://anthonyedgar30000.github.io/report-source.json?source=$REVIEWED_COMMIT" \
              > "$ARTIFACT_DIR/pages-report-source.json"
            if grep -F 'Request header identity mismatch · evidence rejected' "$ARTIFACT_DIR/pages-live-monitor.js" >/dev/null \
              && grep -F 'Request body identity mismatch · evidence rejected' "$ARTIFACT_DIR/pages-live-monitor.js" >/dev/null \
              && grep -F 'Collector identity mismatch · evidence rejected' "$ARTIFACT_DIR/pages-live-monitor.js" >/dev/null \
              && grep -F 'request and collector identity verified' "$ARTIFACT_DIR/pages-live-monitor.js" >/dev/null \
              && ! grep -F 'Request or collector identity mismatch' "$ARTIFACT_DIR/pages-live-monitor.js" >/dev/null \
              && jq -e '.live_demo_api_url == "https://st-demo-api-aeg30000.westus2.cloudapp.azure.com/api/demo/run"' "$ARTIFACT_DIR/pages-report-source.json" >/dev/null; then
              pages_ready=true
              break
            fi
            sleep 10
          done
          [[ "$pages_ready" == true ]]

          jq -n \
            --arg reviewed_commit "$REVIEWED_COMMIT" \
            --arg request_id "$request_id" \
            --arg child_conclusion "$CHILD_CONCLUSION" \
            '{schema_version:"project.correlation-identity-live-verification.v1",reviewed_commit:$reviewed_commit,child_workflow_conclusion:$child_conclusion,health_requests:12,health_verified:true,cors_preflight_status:204,post_status:200,request_id:$request_id,request_header_identity_verified:true,request_body_identity_verified:true,hosting_model_verified:true,transaction_attempts:20,collector_identity_verified:true,frontend_assets_served_with_separate_diagnostics:true,browser_render_execution_not_claimed:true}' \
            > "$ARTIFACT_DIR/live-verification.json"

          body=$(cat <<EOF
          ## Correlation identity live verification passed

          - deployed source: \`$REVIEWED_COMMIT\`
          - child workflow conclusion: **$CHILD_CONCLUSION**
          - 12 consecutive health requests: **passed**
          - CORS preflight: **HTTP 204**
          - live-analysis POST: **HTTP 200**
          - request ID response header/body match: **verified**
          - analysis hosting model: **verified**
          - transactions: **20**
          - governed collector identity and reviewed source: **verified**
          - GitHub Pages separate correlation diagnostics: **served**
          - browser DOM rendering: **awaiting user refresh and a fresh click**

          \`workflow_conclusion != live_service_truth\`
          EOF
          )
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$TRACKER_ISSUE/comments" \
            -f body="$body" > /dev/null

      - name: Upload dispatcher and live-verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: correlation-identity-run1-evidence
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 30
