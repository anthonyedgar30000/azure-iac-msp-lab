name: One-shot Azure probe packet observation run 1

on:
  push:
    branches: [main]
    paths:
      - '.project/diagnostic-requests/probe-packet-observation-run1-20260727.json'

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: one-shot-probe-packet-observation-run1
  cancel-in-progress: false

env:
  REQUEST_FILE: .project/diagnostic-requests/probe-packet-observation-run1-20260727.json
  ARTIFACT_DIR: probe-packet-observation-run1-evidence
  GH_TOKEN: ${{ github.token }}
  AZURE_CORE_ONLY_SHOW_ERRORS: 'true'

jobs:
  observe:
    name: Observe Azure probe packets without mutation
    if: github.repository == 'anthonyedgar30000/azure-iac-msp-lab'
    runs-on: ubuntu-latest
    environment: azure-lab
    timeout-minutes: 20

    steps:
      - name: Check out exact diagnostic request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate finite diagnostic authority
        id: request
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test -f "$REQUEST_FILE"

          jq -e '
            .schema_version == "project.probe-packet-observation-request.v1" and
            .request_id == "probe-packet-observation-run1-20260727" and
            .status == "authorized_unconsumed" and
            .tracking_issue == 160 and
            .repository.name == "anthonyedgar30000/azure-iac-msp-lab" and
            .repository.base_main == "083efec273229b274e5103464cea72176c277933" and
            .starting_evidence.probe_scope_workflow_run == 30289145840 and
            .starting_evidence.probe_scope_artifact_id == 8662373618 and
            .execution.operation == "bounded_read_only_probe_packet_observation" and
            .execution.resource_group == "rg-servicetracer-dev-westus2" and
            .execution.location == "westus2" and
            .execution.load_balancer == "lb-remote-access-mst-dev" and
            .execution.probe_name == "probe-tcp-443-shallow" and
            .execution.probe_protocol == "Tcp" and
            .execution.probe_port == 443 and
            .execution.azure_platform_virtual_ip == "168.63.129.16" and
            .execution.virtual_machines == [
              {"name":"vm-vpn01-mst-dev","private_ip":"10.20.10.11"},
              {"name":"vm-vpn02-mst-dev","private_ip":"10.20.10.12"}
            ] and
            .execution.guest_commands_per_vm == 1 and
            .execution.guest_shell == "/usr/bin/bash" and
            .execution.capture_tool == "tcpdump_if_already_installed" and
            .execution.capture_duration_seconds == 150 and
            .execution.maximum_packet_lines == 12 and
            .execution.snap_length_bytes == 96 and
            .execution.capture_filter == "host 168.63.129.16 and tcp port 443" and
            .execution.payload_decoding == false and
            .execution.public_transactions == 0 and
            .authority.attempt_limit == 1 and
            .authority.renewable == false and
            .authority.transferable == false and
            .authority.azure_authentication_authorized == true and
            .authority.azure_read_only_queries_authorized == true and
            .authority.azure_vm_run_command_authorized == true and
            .authority.read_only_guest_observation_authorized == true and
            .authority.packet_header_observation_authorized == true and
            .authority.package_change_authorized == false and
            .authority.ssh_authorized == false and
            .authority.service_mutation_authorized == false and
            .authority.guest_firewall_mutation_authorized == false and
            .authority.routing_or_sysctl_mutation_authorized == false and
            .authority.packet_injection_authorized == false and
            .authority.packet_payload_capture_authorized == false and
            .authority.public_transaction_authorized == false and
            .authority.network_watcher_capture_authorized == false and
            .authority.azure_resource_mutation_authorized == false and
            .authority.rbac_mutation_authorized == false and
            .authority.automatic_retry_authorized == false and
            .authority.rollback_authorized == false and
            .authority.cleanup_authorized == false
          ' "$REQUEST_FILE" >/dev/null

          valid_until="$(jq -r '.valid_until' "$REQUEST_FILE")"
          (( $(date -u +%s) <= $(date -u -d "$valid_until" +%s) ))

          base_main="$(jq -r '.repository.base_main' "$REQUEST_FILE")"
          git cat-file -e "${base_main}^{commit}"
          git merge-base --is-ancestor "$base_main" "$GITHUB_SHA"

          mkdir -p "$ARTIFACT_DIR"
          cp "$REQUEST_FILE" "$ARTIFACT_DIR/request.json"

          echo "tracking_issue=$(jq -r '.tracking_issue' "$REQUEST_FILE")" >> "$GITHUB_OUTPUT"
          echo "resource_group=$(jq -r '.execution.resource_group' "$REQUEST_FILE")" >> "$GITHUB_OUTPUT"
          echo "location=$(jq -r '.execution.location' "$REQUEST_FILE")" >> "$GITHUB_OUTPUT"
          echo "load_balancer=$(jq -r '.execution.load_balancer' "$REQUEST_FILE")" >> "$GITHUB_OUTPUT"
          echo "probe_name=$(jq -r '.execution.probe_name' "$REQUEST_FILE")" >> "$GITHUB_OUTPUT"
          echo "vm1=$(jq -r '.execution.virtual_machines[0].name' "$REQUEST_FILE")" >> "$GITHUB_OUTPUT"
          echo "vm2=$(jq -r '.execution.virtual_machines[1].name' "$REQUEST_FILE")" >> "$GITHUB_OUTPUT"
          echo "ip1=$(jq -r '.execution.virtual_machines[0].private_ip' "$REQUEST_FILE")" >> "$GITHUB_OUTPUT"
          echo "ip2=$(jq -r '.execution.virtual_machines[1].private_ip' "$REQUEST_FILE")" >> "$GITHUB_OUTPUT"

      - name: Validate observation boundary before Azure login
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/one-shot-probe-packet-observation-run1.yml
          python - "$workflow" <<'PY'
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(encoding="utf-8")
          start = text.index("guest_script=\"$(cat <<'BASH_SCRIPT'")
          end = text.index("\n          BASH_SCRIPT", start)
          guest = text[start:end]

          required = [
              "tcpdump -l -nn -tttt -i any -s 96 -c 12",
              "host 168.63.129.16 and tcp port 443",
              "timeout 150",
              "systemctl is-active servicetracer-demo-backend.service",
              "ufw status",
          ]
          forbidden = [
              "apt-get", "apt install", "dnf ", "yum ", "zypper ", "snap install",
              "systemctl start", "systemctl stop", "systemctl restart",
              "systemctl enable", "systemctl disable", "systemctl mask",
              "ufw allow", "ufw deny", "ufw delete", "ufw reset",
              "ufw enable", "ufw disable", "iptables -A", "iptables -I",
              "iptables -D", "iptables -F", "iptables -P", "nft add",
              "nft insert", "nft delete", "nft flush", "curl ", "wget ",
              "ncat ", "hping", "ping ",
          ]
          missing = [item for item in required if item not in guest]
          present = [item for item in forbidden if item in guest]
          if missing or present:
              raise SystemExit(f"invalid guest boundary: missing={missing}, forbidden={present}")
          PY

      - name: Enforce one-shot admission and record execution start
        env:
          TRACKER_ISSUE: ${{ steps.request.outputs.tracking_issue }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$TRACKER_ISSUE/comments" --jq '[.[] | select(.body | contains("<!-- probe-packet-observation-run1-admitted -->"))] | length')"
          test "$existing" = "0"

          cat > start-comment.md <<EOF
          <!-- probe-packet-observation-run1-admitted -->
          ## Probe packet observation admitted

          The next step begins Azure authentication and consumes the finite diagnostic grant.

          - workflow run: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)
          - commit: \`$GITHUB_SHA\`
          - target VMs: \`vm-vpn01-mst-dev\`, \`vm-vpn02-mst-dev\`
          - capture: existing \`tcpdump\` only, header and TCP flags, maximum 12 lines / 150 seconds
          - guest commands: **one per VM**
          - service or firewall mutation: **false**
          - Azure resource mutation: **false**
          - public transactions: **false**
          - automatic retry / rollback: **false**
          EOF
          gh issue comment "$TRACKER_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file start-comment.md

      - name: Log in to Azure with workload identity federation
        id: azure_login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Capture exact Azure and cost boundary
        id: boundary
        env:
          RESOURCE_GROUP: ${{ steps.request.outputs.resource_group }}
          LOCATION: ${{ steps.request.outputs.location }}
          LOAD_BALANCER: ${{ steps.request.outputs.load_balancer }}
          PROBE_NAME: ${{ steps.request.outputs.probe_name }}
          VM1: ${{ steps.request.outputs.vm1 }}
          VM2: ${{ steps.request.outputs.vm2 }}
          IP1: ${{ steps.request.outputs.ip1 }}
          IP2: ${{ steps.request.outputs.ip2 }}
        shell: bash
        run: |
          set -euo pipefail

          az account show --query '{subscriptionId:id,tenantId:tenantId,name:name,state:state}' --output json > /tmp/account-raw.json
          python - /tmp/account-raw.json "$ARTIFACT_DIR/sanitized-account-context.json" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          src = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          out = {
              "subscription_fingerprint": hashlib.sha256(src["subscriptionId"].encode()).hexdigest()[:16],
              "tenant_fingerprint": hashlib.sha256(src["tenantId"].encode()).hexdigest()[:16],
              "subscription_name": src.get("name"),
              "state": src.get("state"),
          }
          Path(sys.argv[2]).write_text(json.dumps(out, indent=2) + "\n", encoding="utf-8")
          PY
          rm -f /tmp/account-raw.json

          az group show \
            --name "$RESOURCE_GROUP" \
            --query '{name:name,location:location,provisioningState:properties.provisioningState}' \
            --output json > "$ARTIFACT_DIR/resource-group.json"
          test "$(jq -r '.name' "$ARTIFACT_DIR/resource-group.json")" = "$RESOURCE_GROUP"
          test "$(jq -r '.location' "$ARTIFACT_DIR/resource-group.json")" = "$LOCATION"

          az network lb show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$LOAD_BALANCER" \
            --query '{id:id,name:name,location:location,provisioningState:provisioningState,sku:sku,backendPools:backendAddressPools[].name,probes:probes[].name,rules:loadBalancingRules[].name}' \
            --output json > "$ARTIFACT_DIR/load-balancer.json"
          test "$(jq -r '.name' "$ARTIFACT_DIR/load-balancer.json")" = "$LOAD_BALANCER"
          test "$(jq -r '.location' "$ARTIFACT_DIR/load-balancer.json")" = "$LOCATION"

          az network lb probe show \
            --resource-group "$RESOURCE_GROUP" \
            --lb-name "$LOAD_BALANCER" \
            --name "$PROBE_NAME" \
            --query '{name:name,protocol:protocol,port:port,intervalInSeconds:intervalInSeconds,numberOfProbes:numberOfProbes,provisioningState:provisioningState}' \
            --output json > "$ARTIFACT_DIR/probe.json"
          test "$(jq -r '.name' "$ARTIFACT_DIR/probe.json")" = "$PROBE_NAME"
          test "$(jq -r '.protocol' "$ARTIFACT_DIR/probe.json")" = "Tcp"
          test "$(jq -r '.port' "$ARTIFACT_DIR/probe.json")" = "443"
          test "$(jq -r '.intervalInSeconds' "$ARTIFACT_DIR/probe.json")" = "5"
          test "$(jq -r '.numberOfProbes' "$ARTIFACT_DIR/probe.json")" = "2"

          : > "$ARTIFACT_DIR/backend-membership.jsonl"
          for pair in "$VM1:$IP1" "$VM2:$IP2"; do
            vm="${pair%%:*}"
            expected_ip="${pair#*:}"
            az vm show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$vm" \
              --query '{id:id,name:name,location:location,provisioningState:provisioningState,nicId:networkProfile.networkInterfaces[0].id}' \
              --output json > "$ARTIFACT_DIR/${vm}-resource.json"
            test "$(jq -r '.name' "$ARTIFACT_DIR/${vm}-resource.json")" = "$vm"
            test "$(jq -r '.location' "$ARTIFACT_DIR/${vm}-resource.json")" = "$LOCATION"

            power_state="$(az vm get-instance-view \
              --resource-group "$RESOURCE_GROUP" \
              --name "$vm" \
              --query "instanceView.statuses[?starts_with(code, 'PowerState/')].code | [0]" \
              --output tsv)"
            test "$power_state" = "PowerState/running"
            printf '%s\n' "$power_state" > "$ARTIFACT_DIR/${vm}-power-state.txt"

            nic_id="$(jq -r '.nicId' "$ARTIFACT_DIR/${vm}-resource.json")"
            nic_name="${nic_id##*/}"
            az network nic show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$nic_name" \
              --query '{name:name,privateIp:ipConfigurations[0].privateIPAddress,backendPools:ipConfigurations[0].loadBalancerBackendAddressPools[].id}' \
              --output json > "$ARTIFACT_DIR/${vm}-nic.json"
            test "$(jq -r '.privateIp' "$ARTIFACT_DIR/${vm}-nic.json")" = "$expected_ip"
            jq -e --arg lb "$LOAD_BALANCER" '.backendPools | any(.[]; contains("/loadBalancers/" + $lb + "/backendAddressPools/be-vpn-gateways"))' "$ARTIFACT_DIR/${vm}-nic.json" >/dev/null
            jq -n \
              --arg vm "$vm" \
              --arg ip "$expected_ip" \
              --arg nic "$nic_name" \
              '{vm:$vm,private_ip:$ip,nic:$nic,backend_pool:"be-vpn-gateways"}' \
              >> "$ARTIFACT_DIR/backend-membership.jsonl"
          done
          jq -s '.' "$ARTIFACT_DIR/backend-membership.jsonl" > "$ARTIFACT_DIR/backend-membership.json"
          rm -f "$ARTIFACT_DIR/backend-membership.jsonl"

          lb_id="$(jq -r '.id' "$ARTIFACT_DIR/load-balancer.json")"
          echo "lb_id=$lb_id" >> "$GITHUB_OUTPUT"

          az monitor metrics list \
            --resource "$lb_id" \
            --metric DipAvailability \
            --aggregation Average \
            --interval PT1M \
            --filter "BackendIPAddress eq '*' and BackendPort eq '*'" \
            --output json > "$ARTIFACT_DIR/pre-dip-availability.json"

          if ! az vm list-usage --location "$LOCATION" --output json > "$ARTIFACT_DIR/compute-quota.json" 2> "$ARTIFACT_DIR/compute-quota-error.txt"; then
            printf '{"observed":false,"reason":"query_failed"}\n' > "$ARTIFACT_DIR/compute-quota.json"
          fi

          start_date="$(date -u -d '7 days ago' +%F)"
          end_date="$(date -u +%F)"
          if ! az consumption usage list \
            --start-date "$start_date" \
            --end-date "$end_date" \
            --top 20 \
            --output json > "$ARTIFACT_DIR/recent-consumption-context.json" 2> "$ARTIFACT_DIR/recent-consumption-context-error.txt"; then
            printf '{"observed":false,"reason":"query_failed_or_not_authorized"}\n' > "$ARTIFACT_DIR/recent-consumption-context.json"
          fi

      - name: Observe probe packet headers once on both authorized VMs
        id: observe_packets
        env:
          RESOURCE_GROUP: ${{ steps.request.outputs.resource_group }}
          VM1: ${{ steps.request.outputs.vm1 }}
          VM2: ${{ steps.request.outputs.vm2 }}
        shell: bash
        run: |
          set -euo pipefail

          guest_script="$(cat <<'BASH_SCRIPT'
          set -u
          echo "OBSERVATION_VERSION=probe-packet-observation-v1"
          echo "HOSTNAME=$(hostname)"
          echo "SYSTEMD_ACTIVE=$(systemctl is-active servicetracer-demo-backend.service 2>/dev/null || true)"
          echo "SYSTEMD_ENABLED=$(systemctl is-enabled servicetracer-demo-backend.service 2>/dev/null || true)"
          if ss -H -lnt 'sport = :443' | grep -q .; then
            echo "TCP443_LISTENER_PRESENT=true"
          else
            echo "TCP443_LISTENER_PRESENT=false"
          fi
          if ufw status 2>/dev/null | grep -q '^Status: active'; then
            echo "UFW_ACTIVE=true"
          else
            echo "UFW_ACTIVE=false"
          fi

          if ! command -v tcpdump >/dev/null 2>&1; then
            echo "TCPDUMP_AVAILABLE=false"
            echo "PACKET_OBSERVATION_CLASSIFICATION=packet_observation_unavailable"
            exit 0
          fi

          echo "TCPDUMP_AVAILABLE=true"
          echo "CAPTURE_FILTER=host 168.63.129.16 and tcp port 443"
          echo "CAPTURE_DURATION_SECONDS=150"
          echo "CAPTURE_MAXIMUM_PACKET_LINES=12"
          echo "CAPTURE_SNAP_LENGTH_BYTES=96"
          echo "=== PACKET_HEADERS_BEGIN ==="
          set +e
          capture_output="$(timeout 150 tcpdump -l -nn -tttt -i any -s 96 -c 12 'host 168.63.129.16 and tcp port 443' 2>&1)"
          capture_rc=$?
          set -e
          printf '%s\n' "$capture_output"
          echo "=== PACKET_HEADERS_END ==="

          packet_count="$(printf '%s\n' "$capture_output" | grep -Ec '(^| )IP ' || true)"
          inbound_syn_count="$(printf '%s\n' "$capture_output" | grep -Ec '168\.63\.129\.16\.[0-9]+ > [0-9.]+\.443: Flags \[S\]' || true)"
          outbound_synack_count="$(printf '%s\n' "$capture_output" | grep -Ec '[0-9.]+\.443 > 168\.63\.129\.16\.[0-9]+: Flags \[S\.\]' || true)"
          outbound_rst_count="$(printf '%s\n' "$capture_output" | grep -Ec '[0-9.]+\.443 > 168\.63\.129\.16\.[0-9]+: Flags \[R' || true)"

          echo "CAPTURE_EXIT_CODE=$capture_rc"
          echo "PACKET_COUNT=$packet_count"
          echo "INBOUND_SYN_COUNT=$inbound_syn_count"
          echo "OUTBOUND_SYNACK_COUNT=$outbound_synack_count"
          echo "OUTBOUND_RST_COUNT=$outbound_rst_count"

          if (( outbound_rst_count > 0 )); then
            classification=probe_rst_observed
          elif (( inbound_syn_count > 0 && outbound_synack_count > 0 )); then
            classification=probe_syn_and_synack_observed
          elif (( inbound_syn_count > 0 )); then
            classification=probe_syn_observed_no_guest_response
          else
            classification=probe_packets_not_observed
          fi
          echo "PACKET_OBSERVATION_CLASSIFICATION=$classification"
          BASH_SCRIPT
          )"

          guest_script_b64="$(printf '%s' "$guest_script" | base64 -w0)"
          outer_script="printf '%s' '$guest_script_b64' | base64 -d | /usr/bin/bash"

          set +e
          az vm run-command invoke \
            --resource-group "$RESOURCE_GROUP" \
            --name "$VM1" \
            --command-id RunShellScript \
            --scripts "$outer_script" \
            --output json > "$ARTIFACT_DIR/${VM1}-run-command.json" 2> "$ARTIFACT_DIR/${VM1}-run-command-error.txt" &
          pid1=$!

          az vm run-command invoke \
            --resource-group "$RESOURCE_GROUP" \
            --name "$VM2" \
            --command-id RunShellScript \
            --scripts "$outer_script" \
            --output json > "$ARTIFACT_DIR/${VM2}-run-command.json" 2> "$ARTIFACT_DIR/${VM2}-run-command-error.txt" &
          pid2=$!

          wait "$pid1"
          rc1=$?
          wait "$pid2"
          rc2=$?
          set -e

          printf '%s\n' "$rc1" > "$ARTIFACT_DIR/${VM1}-run-command-exit-code.txt"
          printf '%s\n' "$rc2" > "$ARTIFACT_DIR/${VM2}-run-command-exit-code.txt"

          for vm in "$VM1" "$VM2"; do
            if [[ -s "$ARTIFACT_DIR/${vm}-run-command.json" ]] && jq -e . "$ARTIFACT_DIR/${vm}-run-command.json" >/dev/null 2>&1; then
              jq -r '.value[]?.message // empty' "$ARTIFACT_DIR/${vm}-run-command.json" > "$ARTIFACT_DIR/${vm}-observation.txt"
            else
              : > "$ARTIFACT_DIR/${vm}-observation.txt"
            fi
          done

      - name: Capture post-observation metric and classify evidence
        id: analyze
        env:
          LB_ID: ${{ steps.boundary.outputs.lb_id }}
          VM1: ${{ steps.request.outputs.vm1 }}
          VM2: ${{ steps.request.outputs.vm2 }}
        shell: bash
        run: |
          set -euo pipefail

          az monitor metrics list \
            --resource "$LB_ID" \
            --metric DipAvailability \
            --aggregation Average \
            --interval PT1M \
            --filter "BackendIPAddress eq '*' and BackendPort eq '*'" \
            --output json > "$ARTIFACT_DIR/post-dip-availability.json"

          python - "$ARTIFACT_DIR" "$VM1" "$VM2" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          vms = sys.argv[2:4]

          def marker(text: str, name: str):
              match = re.search(rf"^{re.escape(name)}=(.*)$", text, flags=re.MULTILINE)
              return match.group(1).strip() if match else None

          observations = {}
          for vm in vms:
              text = (root / f"{vm}-observation.txt").read_text(encoding="utf-8", errors="replace")
              exit_code_path = root / f"{vm}-run-command-exit-code.txt"
              command_exit = int(exit_code_path.read_text().strip()) if exit_code_path.exists() else None
              observations[vm] = {
                  "run_command_exit_code": command_exit,
                  "hostname": marker(text, "HOSTNAME"),
                  "systemd_active": marker(text, "SYSTEMD_ACTIVE"),
                  "systemd_enabled": marker(text, "SYSTEMD_ENABLED"),
                  "tcp443_listener_present": marker(text, "TCP443_LISTENER_PRESENT"),
                  "ufw_active": marker(text, "UFW_ACTIVE"),
                  "tcpdump_available": marker(text, "TCPDUMP_AVAILABLE"),
                  "capture_exit_code": marker(text, "CAPTURE_EXIT_CODE"),
                  "packet_count": marker(text, "PACKET_COUNT"),
                  "inbound_syn_count": marker(text, "INBOUND_SYN_COUNT"),
                  "outbound_synack_count": marker(text, "OUTBOUND_SYNACK_COUNT"),
                  "outbound_rst_count": marker(text, "OUTBOUND_RST_COUNT"),
                  "classification": marker(text, "PACKET_OBSERVATION_CLASSIFICATION") or "guest_command_failed",
              }

          metric_map = {"10.20.10.11": "vm-vpn01-mst-dev", "10.20.10.12": "vm-vpn02-mst-dev"}
          latest_metrics = {vm: None for vm in metric_map.values()}
          payload = json.loads((root / "post-dip-availability.json").read_text(encoding="utf-8"))
          for metric in payload.get("value") or []:
              for series in metric.get("timeseries") or []:
                  dimensions = {
                      item.get("name", {}).get("value"): item.get("value")
                      for item in series.get("metadatavalues") or []
                  }
                  vm = metric_map.get(dimensions.get("BackendIPAddress"))
                  if not vm:
                      continue
                  values = [
                      point.get("average")
                      for point in series.get("data") or []
                      if point.get("average") is not None
                  ]
                  if values:
                      latest_metrics[vm] = values[-1]

          result = {
              "schema_version": "project.probe-packet-observation-result.v1",
              "workflow_run": int(__import__("os").environ["GITHUB_RUN_ID"]),
              "commit": __import__("os").environ["GITHUB_SHA"],
              "observations": observations,
              "latest_dip_availability": latest_metrics,
              "service_or_firewall_mutation_performed": False,
              "azure_resource_mutation_performed": False,
              "public_transactions_executed": 0,
              "automatic_retry_performed": False,
              "rollback_performed": False,
              "exact_root_cause_claimed": False,
          }
          (root / "analysis.json").write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          PY

          {
            echo '## Probe packet observation'
            echo
            for vm in "$VM1" "$VM2"; do
              echo "- ${vm}: \`$(jq -r --arg vm "$vm" '.observations[$vm].classification' "$ARTIFACT_DIR/analysis.json")\`"
              echo "  - probe packets: \`$(jq -r --arg vm "$vm" '.observations[$vm].packet_count // "not_observed"' "$ARTIFACT_DIR/analysis.json")\`"
              echo "  - inbound SYN: \`$(jq -r --arg vm "$vm" '.observations[$vm].inbound_syn_count // "not_observed"' "$ARTIFACT_DIR/analysis.json")\`"
              echo "  - outbound SYN-ACK: \`$(jq -r --arg vm "$vm" '.observations[$vm].outbound_synack_count // "not_observed"' "$ARTIFACT_DIR/analysis.json")\`"
              echo "  - latest DipAvailability: \`$(jq -r --arg vm "$vm" '.latest_dip_availability[$vm] // "not_observed"' "$ARTIFACT_DIR/analysis.json")\`"
            done
            echo
            echo '- Exact root cause claimed: `false`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          find "$ARTIFACT_DIR" -maxdepth 1 -type f ! -name manifest.sha256 -print0 \
            | sort -z \
            | xargs -0 -r sha256sum \
            | sed "s#  $ARTIFACT_DIR/#  #" \
            > "$ARTIFACT_DIR/manifest.sha256"

      - name: Upload bounded packet observation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-packet-observation-run1-evidence
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish terminal result
        if: always()
        env:
          TRACKER_ISSUE: ${{ steps.request.outputs.tracking_issue }}
          VM1: ${{ steps.request.outputs.vm1 }}
          VM2: ${{ steps.request.outputs.vm2 }}
        shell: bash
        run: |
          set -uo pipefail
          job_status="${{ job.status }}"
          analysis_file="$ARTIFACT_DIR/analysis.json"

          vm1_class=not_observed
          vm2_class=not_observed
          vm1_metric=not_observed
          vm2_metric=not_observed
          if [[ -f "$analysis_file" ]]; then
            vm1_class="$(jq -r --arg vm "$VM1" '.observations[$vm].classification // "not_observed"' "$analysis_file")"
            vm2_class="$(jq -r --arg vm "$VM2" '.observations[$vm].classification // "not_observed"' "$analysis_file")"
            vm1_metric="$(jq -r --arg vm "$VM1" '.latest_dip_availability[$vm] // "not_observed"' "$analysis_file")"
            vm2_metric="$(jq -r --arg vm "$VM2" '.latest_dip_availability[$vm] // "not_observed"' "$analysis_file")"
          fi

          cat > terminal-comment.md <<EOF
          ## Probe packet observation terminal result

          - workflow run: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)
          - commit: \`$GITHUB_SHA\`
          - job status: **$job_status**
          - authority consumed: **true**
          - \`$VM1\`: \`$vm1_class\`
          - \`$VM2\`: \`$vm2_class\`
          - latest DipAvailability / \`$VM1\`: \`$vm1_metric\`
          - latest DipAvailability / \`$VM2\`: \`$vm2_metric\`
          - service or firewall mutation: **false**
          - Azure resource mutation: **false**
          - public transactions: **0**
          - automatic retry: **false**
          - rollback: **false**
          - exact root cause claimed: **false**

          Evidence is attached to this workflow run as \`probe-packet-observation-run1-evidence\` when artifact publication succeeded.

          No rerun or follow-on repair is authorized by this consumed diagnostic grant.
          EOF
          gh issue comment "$TRACKER_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file terminal-comment.md || true
