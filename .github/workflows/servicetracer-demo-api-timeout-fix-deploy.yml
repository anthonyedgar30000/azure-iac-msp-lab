name: Deploy ServiceTracer demo API timeout fix

on:
  push:
    branches:
      - agent/integrate-demo-api-frontend
    paths:
      - .project/authorizations/servicetracer-demo-api-timeout-fix-deployment-20260724.json

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: servicetracer-demo-api-timeout-fix-deployment
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-st-demo-api-dev-westus2
  VM_NAME: vm-st-demo-api-mst-dev
  FQDN: st-demo-api-vm-aeg30000.westus2.cloudapp.azure.com
  DEPLOYMENT_NAME: servicetracer-demo-api-dev
  TEMPLATE_FILE: workloads/servicetracer-demo-api/infra/update-existing-extension.bicep
  EVIDENCE_DIR: servicetracer-demo-api-timeout-fix-deployment-evidence
  PREVIOUS_TRUSTED_SOURCE_REF: 8b3d55c616d8820edd523f77021a35fe24167bd0
  SOURCE_REPOSITORY: https://github.com/anthonyedgar30000/azure-iac-msp-lab.git
  ALLOWED_ORIGIN: https://anthonyedgar30000.github.io

jobs:
  deploy:
    name: Deploy exact timeout fix through existing VM extension
    runs-on: ubuntu-latest
    environment: azure-api-payg
    timeout-minutes: 45
    steps:
      - name: Check out exact authorized branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate authorization and immutable source
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/agent/integrate-demo-api-frontend'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile workloads/servicetracer-demo-api/scripts/assert_extension_update_what_if.py
          bash -n workloads/servicetracer-demo-api/scripts/install.sh
          marker='.project/authorizations/servicetracer-demo-api-timeout-fix-deployment-20260724.json'
          jq -e '
            .schema_version == "project.azure-deployment-authorization.v1" and
            .authorized == true and
            .authorization_source == "Explicit governed control message: granted" and
            .scope.resource_group == "rg-st-demo-api-dev-westus2" and
            .scope.vm == "vm-st-demo-api-mst-dev" and
            .scope.only_existing_extension_update == true and
            .authority.deployment == true and
            .authority.rollback_on_failed_verification == true and
            .authority.transaction_replay == false and
            .authority.pull_request_merge == false and
            .authority.github_pages_publication == false and
            .authority.cleanup == false
          ' "$marker" >/dev/null

      - name: Wait for exact-head pull-request CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=''
          conclusion=''
          run_id=''
          for _ in $(seq 1 150); do
            gh api -X GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f branch='agent/integrate-demo-api-frontend' \
              -f event='pull_request' \
              -F per_page=30 \
              > /tmp/ci-runs.json
            run_id="$(jq -r --arg sha "$GITHUB_SHA" '.workflow_runs | map(select(.head_sha == $sha)) | .[0].id // empty' /tmp/ci-runs.json)"
            if [[ -n "$run_id" ]]; then
              status="$(jq -r --arg sha "$GITHUB_SHA" '.workflow_runs | map(select(.head_sha == $sha)) | .[0].status' /tmp/ci-runs.json)"
              conclusion="$(jq -r --arg sha "$GITHUB_SHA" '.workflow_runs | map(select(.head_sha == $sha)) | .[0].conclusion // ""' /tmp/ci-runs.json)"
              if [[ "$status" == completed ]]; then
                break
              fi
            fi
            sleep 8
          done
          test -n "$run_id"
          test "$status" = completed
          test "$conclusion" = success
          mkdir -p "$EVIDENCE_DIR"
          jq -n --argjson run_id "$run_id" --arg status "$status" --arg conclusion "$conclusion" --arg source_head "$GITHUB_SHA" \
            '{run_id:$run_id,status:$status,conclusion:$conclusion,source_head:$source_head}' \
            > "$EVIDENCE_DIR/exact-head-ci.json"

      - name: Log in to target Azure subscription
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_TARGET_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_TARGET_SUBSCRIPTION_ID }}

      - name: Preflight current Azure reality and accepted What-If
        env:
          EXPECTED_SUBSCRIPTION_ID: ${{ secrets.AZURE_TARGET_SUBSCRIPTION_ID }}
          EXPECTED_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          TARGET_CLIENT_ID: ${{ secrets.AZURE_TARGET_CLIENT_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          az account show --query '{id:id,name:name,tenantId:tenantId,state:state}' -o json > /tmp/account.raw.json
          jq --arg subscription "$EXPECTED_SUBSCRIPTION_ID" --arg tenant "$EXPECTED_TENANT_ID" \
            'if .id != $subscription or .tenantId != $tenant or .state != "Enabled" then error("unexpected Azure context") else {subscription_name:.name,state:.state,subscription_sha256:($subscription|@base64),tenant_sha256:($tenant|@base64)} end' \
            /tmp/account.raw.json > "$EVIDENCE_DIR/account.json"

          az group show -g "$RESOURCE_GROUP" -o json > "$EVIDENCE_DIR/resource-group.json"
          az resource list -g "$RESOURCE_GROUP" -o json > "$EVIDENCE_DIR/resources-before.json"
          test "$(jq 'length' "$EVIDENCE_DIR/resources-before.json")" = '7'
          az vm get-instance-view -g "$RESOURCE_GROUP" -n "$VM_NAME" -o json > "$EVIDENCE_DIR/vm-instance-view-before.json"
          jq -e '.statuses | any(.code == "PowerState/running")' "$EVIDENCE_DIR/vm-instance-view-before.json" >/dev/null

          az deployment group show -g "$RESOURCE_GROUP" -n "$DEPLOYMENT_NAME" --query properties.parameters -o json \
            > "$EVIDENCE_DIR/current-deployment-parameters.json"
          backend_url="$(jq -r '.backendTransactionUrl.value // empty' "$EVIDENCE_DIR/current-deployment-parameters.json")"
          current_origin="$(jq -r '.allowedOrigin.value // empty' "$EVIDENCE_DIR/current-deployment-parameters.json")"
          current_repo="$(jq -r '.sourceRepository.value // empty' "$EVIDENCE_DIR/current-deployment-parameters.json")"
          test "$current_origin" = "$ALLOWED_ORIGIN"
          test "$current_repo" = "$SOURCE_REPOSITORY"
          [[ "$backend_url" =~ ^https://[A-Za-z0-9.:-]+/transaction$ ]]
          printf '%s\n' "$backend_url" > "$EVIDENCE_DIR/backend-transaction-url.txt"

          az role assignment list --assignee "$TARGET_CLIENT_ID" --scope "$(az group show -g "$RESOURCE_GROUP" --query id -o tsv)" --include-inherited -o json \
            > "$EVIDENCE_DIR/deployment-identity-role-assignments.json"
          az vm list-usage -l westus2 -o json > "$EVIDENCE_DIR/compute-usage.json"
          az network list-usages -l westus2 -o json > "$EVIDENCE_DIR/network-usage.json"

          cost_body='{"type":"ActualCost","timeframe":"MonthToDate","dataset":{"granularity":"None","aggregation":{"totalCost":{"name":"PreTaxCost","function":"Sum"}},"grouping":[{"type":"Dimension","name":"ResourceType"}]}}'
          set +e
          az rest --method post \
            --uri "$(az group show -g "$RESOURCE_GROUP" --query id -o tsv)/providers/Microsoft.CostManagement/query?api-version=2025-03-01" \
            --body "$cost_body" -o json > "$EVIDENCE_DIR/cost-month-to-date.json" 2> "$EVIDENCE_DIR/cost-month-to-date.error.txt"
          cost_status=$?
          set -e
          jq -n --argjson exit_status "$cost_status" '{query_attempted:true,exit_status:$exit_status,claim_boundary:"Cost observation failure does not imply zero cost; the extension-only update creates no new recurring resource."}' \
            > "$EVIDENCE_DIR/cost-query-status.json"

          curl --fail --silent --show-error --connect-timeout 10 --max-time 45 \
            "https://${FQDN}/api/health" > "$EVIDENCE_DIR/health-before.json"
          jq -e '.status == "healthy" and .hosting_model == "dedicated_vm_subproject"' "$EVIDENCE_DIR/health-before.json" >/dev/null

          installer_uri="https://raw.githubusercontent.com/anthonyedgar30000/azure-iac-msp-lab/${GITHUB_SHA}/workloads/servicetracer-demo-api/scripts/install.sh"
          printf '%s\n' "$installer_uri" > "$EVIDENCE_DIR/installer-uri.txt"
          force_tag="timeout-fix-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' "$force_tag" > "$EVIDENCE_DIR/force-update-tag.txt"

          az deployment group validate \
            -g "$RESOURCE_GROUP" \
            --name "servicetracer-timeout-fix-validate-${GITHUB_RUN_ID}" \
            --template-file "$TEMPLATE_FILE" \
            --parameters vmName="$VM_NAME" sourceRepository="$SOURCE_REPOSITORY" sourceRef="$GITHUB_SHA" installerUri="$installer_uri" publicFqdn="$FQDN" backendTransactionUrl="$backend_url" allowedOrigin="$ALLOWED_ORIGIN" forceUpdateTag="$force_tag" \
            -o json > "$EVIDENCE_DIR/validation.json"

          az deployment group what-if \
            -g "$RESOURCE_GROUP" \
            --name "servicetracer-timeout-fix-whatif-${GITHUB_RUN_ID}" \
            --template-file "$TEMPLATE_FILE" \
            --parameters vmName="$VM_NAME" sourceRepository="$SOURCE_REPOSITORY" sourceRef="$GITHUB_SHA" installerUri="$installer_uri" publicFqdn="$FQDN" backendTransactionUrl="$backend_url" allowedOrigin="$ALLOWED_ORIGIN" forceUpdateTag="$force_tag" \
            --no-pretty-print --result-format FullResourcePayloads \
            -o json > "$EVIDENCE_DIR/what-if.json"

          python3 workloads/servicetracer-demo-api/scripts/assert_extension_update_what_if.py \
            "$EVIDENCE_DIR/what-if.json" \
            --subscription-id "$EXPECTED_SUBSCRIPTION_ID" \
            --resource-group "$RESOURCE_GROUP" \
            --vm-name "$VM_NAME" \
            --output "$EVIDENCE_DIR/what-if-assessment.json"

      - name: Deploy extension update and verify corrected health contract
        id: deploy
        run: |
          set +e
          backend_url="$(cat "$EVIDENCE_DIR/backend-transaction-url.txt")"
          installer_uri="$(cat "$EVIDENCE_DIR/installer-uri.txt")"
          force_tag="$(cat "$EVIDENCE_DIR/force-update-tag.txt")"
          deployment_name="servicetracer-timeout-fix-${GITHUB_RUN_ID}"

          az deployment group create \
            -g "$RESOURCE_GROUP" \
            --name "$deployment_name" \
            --template-file "$TEMPLATE_FILE" \
            --parameters vmName="$VM_NAME" sourceRepository="$SOURCE_REPOSITORY" sourceRef="$GITHUB_SHA" installerUri="$installer_uri" publicFqdn="$FQDN" backendTransactionUrl="$backend_url" allowedOrigin="$ALLOWED_ORIGIN" forceUpdateTag="$force_tag" \
            -o json > "$EVIDENCE_DIR/deployment-result.json" 2> "$EVIDENCE_DIR/deployment.error.txt"
          deploy_status=$?

          health_verified=1
          if [[ "$deploy_status" = 0 ]]; then
            for _ in $(seq 1 45); do
              if curl --fail --silent --show-error --connect-timeout 10 --max-time 45 \
                "https://${FQDN}/api/health" > "$EVIDENCE_DIR/health-after.json" 2> "$EVIDENCE_DIR/health-after.error.txt"; then
                if jq -e '
                  .status == "healthy" and
                  .hosting_model == "dedicated_vm_subproject" and
                  .backend_timeout_seconds == 10 and
                  .max_parallel_transactions == 10 and
                  .max_attempts == 50 and
                  .estimated_max_execution_seconds == 50
                ' "$EVIDENCE_DIR/health-after.json" >/dev/null; then
                  health_verified=0
                  break
                fi
              fi
              sleep 8
            done
          fi

          az vm extension show -g "$RESOURCE_GROUP" --vm-name "$VM_NAME" -n servicetracer-demo-api -o json \
            > "$EVIDENCE_DIR/extension-after.json" 2> "$EVIDENCE_DIR/extension-after.error.txt"
          extension_status=$?
          extension_succeeded=1
          if [[ "$extension_status" = 0 ]] && jq -e '.provisioningState == "Succeeded"' "$EVIDENCE_DIR/extension-after.json" >/dev/null; then
            extension_succeeded=0
          fi

          az resource list -g "$RESOURCE_GROUP" -o json > "$EVIDENCE_DIR/resources-after.json"
          resource_count_after="$(jq 'length' "$EVIDENCE_DIR/resources-after.json")"

          if [[ "$deploy_status" = 0 && "$health_verified" = 0 && "$extension_succeeded" = 0 && "$resource_count_after" = 7 ]]; then
            jq -n --arg deployment_name "$deployment_name" --arg source_ref "$GITHUB_SHA" \
              '{status:"deployed_and_health_verified",deployment_name:$deployment_name,source_ref:$source_ref,extension_provisioning_succeeded:true,corrected_health_contract_verified:true,resource_count_preserved:7,transaction_replay_performed:false,rollback_performed:false}' \
              > "$EVIDENCE_DIR/deployment-summary.json"
            printf 'DEPLOYMENT_OUTCOME=success\n' > "$EVIDENCE_DIR/outcome.env"
            exit 0
          fi

          rollback_installer="https://raw.githubusercontent.com/anthonyedgar30000/azure-iac-msp-lab/${PREVIOUS_TRUSTED_SOURCE_REF}/workloads/servicetracer-demo-api/scripts/install.sh"
          rollback_tag="rollback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          az deployment group create \
            -g "$RESOURCE_GROUP" \
            --name "servicetracer-timeout-fix-rollback-${GITHUB_RUN_ID}" \
            --template-file "$TEMPLATE_FILE" \
            --parameters vmName="$VM_NAME" sourceRepository="$SOURCE_REPOSITORY" sourceRef="$PREVIOUS_TRUSTED_SOURCE_REF" installerUri="$rollback_installer" publicFqdn="$FQDN" backendTransactionUrl="$backend_url" allowedOrigin="$ALLOWED_ORIGIN" forceUpdateTag="$rollback_tag" \
            -o json > "$EVIDENCE_DIR/rollback-result.json" 2> "$EVIDENCE_DIR/rollback.error.txt"
          rollback_status=$?

          rollback_health=1
          if [[ "$rollback_status" = 0 ]]; then
            for _ in $(seq 1 45); do
              if curl --fail --silent --show-error --connect-timeout 10 --max-time 45 \
                "https://${FQDN}/api/health" > "$EVIDENCE_DIR/health-after-rollback.json" 2> "$EVIDENCE_DIR/health-after-rollback.error.txt" && \
                jq -e '.status == "healthy" and .hosting_model == "dedicated_vm_subproject"' "$EVIDENCE_DIR/health-after-rollback.json" >/dev/null; then
                rollback_health=0
                break
              fi
              sleep 8
            done
          fi

          jq -n \
            --argjson deploy_exit_status "$deploy_status" \
            --argjson corrected_health_verified "$([[ "$health_verified" = 0 ]] && echo true || echo false)" \
            --argjson extension_succeeded "$([[ "$extension_succeeded" = 0 ]] && echo true || echo false)" \
            --argjson resource_count_after "$resource_count_after" \
            --argjson rollback_exit_status "$rollback_status" \
            --argjson rollback_health_verified "$([[ "$rollback_health" = 0 ]] && echo true || echo false)" \
            --arg attempted_source_ref "$GITHUB_SHA" \
            --arg restored_source_ref "$PREVIOUS_TRUSTED_SOURCE_REF" \
            '{status:"deployment_failed_or_unverified",deploy_exit_status:$deploy_exit_status,corrected_health_verified:$corrected_health_verified,extension_succeeded:$extension_succeeded,resource_count_after:$resource_count_after,rollback_performed:true,rollback_exit_status:$rollback_exit_status,rollback_health_verified:$rollback_health_verified,attempted_source_ref:$attempted_source_ref,restored_source_ref:$restored_source_ref,transaction_replay_performed:false}' \
            > "$EVIDENCE_DIR/deployment-summary.json"
          printf 'DEPLOYMENT_OUTCOME=failure\n' > "$EVIDENCE_DIR/outcome.env"
          exit 1

      - name: Build evidence manifest
        if: always()
        run: |
          set -euo pipefail
          find "$EVIDENCE_DIR" -type f ! -name artifact-manifest.sha256 -print0 \
            | sort -z | xargs -0 -r sha256sum \
            > "$EVIDENCE_DIR/artifact-manifest.sha256"

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: servicetracer-demo-api-timeout-fix-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90
