name: Azure AI read-only preflight

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: Proposed dedicated Azure AI resource group to observe
        required: true
        default: rg-ai-msp-dev-canadaeast
        type: string
      reviewed_commit:
        description: Exact 40-character repository commit reviewed for this preflight
        required: true
        type: string
      confirmation:
        description: Enter OBSERVE-AZURE-AI:<resource-group>:<reviewed-commit>
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-ai-read-only-preflight
  cancel-in-progress: false

env:
  AZURE_CORE_ONLY_SHOW_ERRORS: 'true'
  AZURE_AI_CANDIDATE_LOCATIONS: canadaeast,eastus2
  AZURE_AI_CANDIDATE_MODELS_JSON: >-
    [{"name":"gpt-4.1-mini","version":"2025-04-14"},{"name":"gpt-5-mini","version":"2025-08-07"}]

jobs:
  preflight:
    name: Observe Azure AI prerequisites without mutation
    runs-on: ubuntu-latest
    environment: azure-lab
    timeout-minutes: 30
    steps:
      - name: Check out exact reviewed repository state
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.reviewed_commit }}
          fetch-depth: 0

      - name: Validate bounded read-only authority
        env:
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RESOURCE_GROUP" =~ ^[A-Za-z0-9._()-]{1,90}$ ]]
          [[ "$RESOURCE_GROUP" != *. ]]
          [[ "$REVIEWED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$REVIEWED_COMMIT" ]]
          expected="OBSERVE-AZURE-AI:${RESOURCE_GROUP}:${REVIEWED_COMMIT}"
          [[ "$CONFIRMATION" == "$expected" ]] || {
            echo "Confirmation must exactly equal: $expected" >&2
            exit 1
          }

          workdir="$RUNNER_TEMP/azure-ai-read-only-preflight"
          mkdir -p "$workdir/evidence"
          jq -n \
            --arg operation azure_ai_read_only_preflight \
            --arg reviewed_commit "$REVIEWED_COMMIT" \
            --arg resource_group "$RESOURCE_GROUP" \
            --arg candidate_locations "$AZURE_AI_CANDIDATE_LOCATIONS" \
            --argjson candidate_models "$AZURE_AI_CANDIDATE_MODELS_JSON" \
            '{
              operation:$operation,
              reviewed_commit:$reviewed_commit,
              resource_group:$resource_group,
              candidate_locations:($candidate_locations | split(",")),
              candidate_models:$candidate_models,
              azure_authentication_authorized:true,
              azure_queries_authorized:true,
              azure_mutations_authorized:false,
              provider_registration_authorized:false,
              resource_group_creation_authorized:false,
              role_assignment_authorized:false,
              model_deployment_authorized:false,
              model_request_authorized:false
            }' > "$workdir/evidence/request.json"

      - name: Verify static workflow, script, and IaC boundaries before Azure login
        run: python -m unittest infra.tests.test_azure_ai_live_activation -v

      - name: Log in to Azure with workload identity federation
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run read-only Azure AI preflight
        env:
          AZURE_AI_HOSTING_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_AI_RESOURCE_GROUP: ${{ inputs.resource_group }}
          AZURE_AI_WORKDIR: ${{ runner.temp }}/azure-ai-read-only-preflight
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/azure_ai_read_only_preflight.sh
          scripts/azure_ai_read_only_preflight.sh

      - name: Write protected evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/azure-ai-read-only-preflight/evidence"
          if [[ -d "$evidence_dir" ]]; then
            find "$evidence_dir" -type f ! -name artifact-manifest.sha256 -print0 \
              | sort -z \
              | xargs -0 -r sha256sum \
              > "$evidence_dir/artifact-manifest.sha256"
          fi

      - name: Summarize authority boundary
        if: always()
        env:
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
        shell: bash
        run: |
          {
            echo '## Azure AI read-only preflight'
            echo
            echo "- Reviewed commit: \`$REVIEWED_COMMIT\`"
            echo "- Proposed resource group: \`$RESOURCE_GROUP\`"
            echo "- Candidate locations: \`$AZURE_AI_CANDIDATE_LOCATIONS\`"
            echo '- Azure authentication and read-only queries: authorized only for this bounded preflight'
            echo '- Azure mutation authority: `false`'
            echo '- Provider registration authority: `false`'
            echo '- Resource-group creation authority: `false`'
            echo '- RBAC mutation authority: `false`'
            echo '- Model deployment authority: `false`'
            echo '- Model request authority: `false`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload protected non-secret preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-ai-read-only-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/azure-ai-read-only-preflight/evidence
          if-no-files-found: error
          retention-days: 30
