name: Apply frontend healthy status chip

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-frontend-healthy-status-chip.yml
      - infra/tests/test_frontend_status_chip.py

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/frontend-healthy-status-chip'
    name: Patch, validate, and self-remove
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply explicit incident-state contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('docs/app.js')
          app = app_path.read_text(encoding='utf-8')
          old = """function setIncidentState(text, warning = false) {
            elements.incidentChip.textContent = text;
            elements.incidentChip.classList.toggle('status-warning', warning);
            elements.incidentChip.classList.toggle('status-neutral', !warning);
          }
          """
          new = """const INCIDENT_STATES = new Set(['neutral', 'healthy', 'warning']);

          function setIncidentState(text, stateName = 'neutral') {
            const resolvedState = INCIDENT_STATES.has(stateName) ? stateName : 'neutral';
            elements.incidentChip.textContent = text;
            elements.incidentChip.classList.remove('status-neutral', 'status-healthy', 'status-warning');
            elements.incidentChip.classList.add(`status-${resolvedState}`);
          }
          """
          if old not in app:
              raise SystemExit('original setIncidentState contract not found')
          app = app.replace(old, new, 1)

          replacements = {
              "setIncidentState(stale ? 'Live report is stale' : 'Awaiting analysis', stale);": "setIncidentState(stale ? 'Live report is stale' : 'Awaiting analysis', stale ? 'warning' : 'neutral');",
              "setIncidentState('Live Azure evidence captured');": "setIncidentState('Live Azure evidence captured', 'healthy');",
              "setIncidentState('Service verified');": "setIncidentState('Service verified', 'healthy');",
              "    true,\n  );": "    'warning',\n  );",
              "setIncidentState('Live report is stale', true);": "setIncidentState('Live report is stale', 'warning');",
              "setIncidentState('Live lab API ready');": "setIncidentState('Live lab API ready', 'healthy');",
              "setIncidentState('Report unavailable', true);": "setIncidentState('Report unavailable', 'warning');",
          }
          for before, after in replacements.items():
              if before not in app:
                  raise SystemExit(f'expected app.js marker not found: {before!r}')
              app = app.replace(before, after, 1)
          app_path.write_text(app, encoding='utf-8')

          styles_path = Path('docs/styles.css')
          styles = styles_path.read_text(encoding='utf-8')
          marker = """.status-warning {
            border-color: rgba(247, 199, 107, 0.35);
            background: var(--warning-soft);
            color: var(--warning);
          }
          """
          healthy = """.status-healthy {
            border-color: rgba(63, 211, 155, 0.42);
            background: var(--healthy-soft);
            color: var(--healthy);
            box-shadow: 0 0 0 4px rgba(63, 211, 155, 0.07);
          }

          """
          if marker not in styles:
              raise SystemExit('status-warning CSS marker not found')
          styles = styles.replace(marker, healthy + marker, 1)
          styles_path.write_text(styles, encoding='utf-8')
          PY

      - name: Validate focused frontend change
        run: |
          set -euo pipefail
          node --check docs/app.js
          python3 -m unittest infra.tests.test_frontend_status_chip -v
          python3 -m unittest infra.tests.test_frontend_api_demo_lab_integration -v

      - name: Remove helper and commit clean patch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-frontend-healthy-status-chip.yml
          git add docs/app.js docs/styles.css infra/tests/test_frontend_status_chip.py
          git commit -m "Render verified frontend readiness as healthy"
          git push origin HEAD:${{ github.head_ref }}
