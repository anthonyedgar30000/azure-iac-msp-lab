name: Azure MCP live activation static validation

on:
  pull_request:
    paths:
      - '.github/workflows/durable-authorization-claim-v2.yml'
      - '.github/workflows/azure-mcp-live-deploy.yml'
      - '.github/workflows/azure-mcp-live-static-validation.yml'
      - 'infra/scripts/authority_claim_v2.py'
      - 'infra/azure-mcp-live/**'
      - 'infra/tests/test_azure_mcp_live_activation.py'
      - '.project/contracts/azure-mcp-live-activation-v1.json'
      - '.project/contracts/azure-mcp-live-scope-v1.json'
      - '.project/reconciliations/post-pr197-azure-mcp-live-activation-plan-20260729.json'
      - '.project/handoffs/azure-mcp-live-activation-v1.md'
      - '.project/deployment-requests/azure-mcp-live-run1.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/durable-authorization-claim-v2.yml'
      - '.github/workflows/azure-mcp-live-deploy.yml'
      - '.github/workflows/azure-mcp-live-static-validation.yml'
      - 'infra/scripts/authority_claim_v2.py'
      - 'infra/azure-mcp-live/**'
      - 'infra/tests/test_azure_mcp_live_activation.py'
      - '.project/contracts/azure-mcp-live-activation-v1.json'
      - '.project/contracts/azure-mcp-live-scope-v1.json'
      - '.project/reconciliations/post-pr197-azure-mcp-live-activation-plan-20260729.json'
      - '.project/handoffs/azure-mcp-live-activation-v1.md'
      - '.project/deployment-requests/azure-mcp-live-run1.json'

permissions:
  contents: read
  id-token: none

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic activation tests
        run: python -m unittest infra.tests.test_azure_mcp_live_activation -v
      - name: Lint and build Bicep
        uses: azure/CLI@v2
        with:
          inlineScript: |
            set -euo pipefail
            az bicep install
            az bicep version
            az bicep lint --file infra/azure-mcp-live/main.bicep
            az bicep build --file infra/azure-mcp-live/main.bicep --outfile /tmp/azure-mcp-live.json
            az bicep build-params --file infra/azure-mcp-live/main.bicepparam --outfile /tmp/azure-mcp-live.parameters.json
            az bicep lint --file infra/azure-mcp-live/entra.bicep
            az bicep build --file infra/azure-mcp-live/entra.bicep --outfile /tmp/azure-mcp-entra.json
            jq -e '.parameters.imageReference.value | contains("@sha256:")' /tmp/azure-mcp-live.parameters.json >/dev/null
            jq -e '.parameters.namespaces.value == ["compute","monitor"]' /tmp/azure-mcp-live.parameters.json >/dev/null
            jq -e '.parameters.serverAppClientId.value == "00000000-0000-0000-0000-000000000001"' /tmp/azure-mcp-live.parameters.json >/dev/null
      - name: Upload static outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-mcp-live-static-validation
          path: |
            /tmp/azure-mcp-live.json
            /tmp/azure-mcp-live.parameters.json
            /tmp/azure-mcp-entra.json
          if-no-files-found: warn
          retention-days: 14
