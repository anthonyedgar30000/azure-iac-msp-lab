name: Apply provenance monitor reconciliation once

on:
  push:
    branches:
      - feature/frontend-azure-provenance-monitor
    paths:
      - .github/workflows/apply-provenance-monitor-reconciliation-once.yml

permissions:
  contents: write

concurrency:
  group: apply-provenance-monitor-reconciliation-once
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref_name == 'feature/frontend-azure-provenance-monitor'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BRANCH: feature/frontend-azure-provenance-monitor
      EXPECTED_PARENT: 9112d6f72634e54d298a9b3715c4a8ea4ab4da99
      EXPECTED_MAIN: 855ef85f898cbf34db2931abc8344d05cb05c6f7
      MERGE_BASE: 50ae9113fafccbe31b3e2d076c021c814e4f446d
    steps:
      - name: Check out exact implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Enforce exact repository boundary
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$BRANCH"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git merge-base HEAD origin/main)" = "$MERGE_BASE"

      - name: Bind active frontend contracts to collector golden path
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          from textwrap import dedent

          old = "https://st-demo-api-vm-aeg30000.westus2.cloudapp.azure.com/api/demo/run"
          collector = "https://st-demo-api-aeg30000.westus2.cloudapp.azure.com/api/demo/run"
          old_status = "live_default_pending_github_pages_verification"
          collector_status = "collector_live_default_pending_github_pages_verification"

          endpoint_targets = (
              ".project/validate.py",
              "infra/tests/test_frontend_api_demo_lab_integration.py",
              "infra/tests/test_frontend_live_default_activation.py",
              "infra/tests/test_collector_demo_api.py",
              "scripts/verify_frontend_live_default.mjs",
              "docs/reviews/frontend-live-default-activation-20260726.md",
              "docs/runbooks/frontend-api-demo-lab-integration.md",
              "docs/designs/frontend-azure-provenance-monitor.md",
          )
          for name in endpoint_targets:
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected independent endpoint missing from {name}")
              path.write_text(text.replace(old, collector), encoding="utf-8")

          status_targets = (
              ".project/validate.py",
              "infra/tests/test_frontend_api_demo_lab_integration.py",
              "infra/tests/test_frontend_live_default_activation.py",
              "infra/tests/test_collector_demo_api.py",
              "scripts/verify_frontend_live_default.mjs",
          )
          for name in status_targets:
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if old_status not in text:
                  raise SystemExit(f"expected activation state missing from {name}")
              path.write_text(text.replace(old_status, collector_status), encoding="utf-8")

          source_path = Path("docs/report-source.json")
          source = json.loads(source_path.read_text(encoding="utf-8"))
          expected_host = {
              "resource_group": "rg-servicetracer-dev-westus2",
              "vm_name": "vm-stcollector-mst-dev",
              "location": "westus2",
              "hosting_model": "collector_vm_systemd",
          }
          if source.get("live_demo_api_url") != collector:
              raise SystemExit("active frontend is not bound to the collector endpoint")
          if source.get("candidate_demo_api_url") != collector:
              raise SystemExit("candidate frontend is not bound to the collector endpoint")
          if source.get("activation_status") != collector_status:
              raise SystemExit("collector activation state is not exact")
          if source.get("expected_azure_host") != expected_host:
              raise SystemExit("expected Azure host identity is not exact")

          review = Path("docs/reviews/frontend-live-default-activation-20260726.md")
          review_text = review.read_text(encoding="utf-8")
          if "## Governed provenance monitor" not in review_text:
              review_text += dedent(
                  f"""

                  ## Governed provenance monitor

                  The frontend now renders a live proof chain for the exact collector-hosted golden path:

                  ```text
                  GitHub Pages frontend
                    -> {collector}
                    -> vm-stcollector-mst-dev
                    ∈ rg-servicetracer-dev-westus2
                  ```

                  The resource group is a governance and lifecycle scope, not a traffic endpoint. The monitor becomes healthy only when the API returns Azure Instance Metadata Service identity matching the configured resource group, collector VM, region, hosting model, and a valid exact deployment source commit. A browser-generated request UUID must also be echoed by the same governed collector response.

                  ```text
                  API_compatible != collector_golden_path
                  API_healthy != Azure_host_identity_verified
                  request_sent != response_correlation_verified
                  ```
                  """
              )
              review.write_text(review_text, encoding="utf-8")

          reconciliation_path = Path(
              ".project/reconciliations/frontend-azure-provenance-monitor-20260726.json"
          )
          reconciliation = json.loads(reconciliation_path.read_text(encoding="utf-8"))
          repository = reconciliation["repository"]
          repository["observed_latest_merged_pull_request_before_branch"] = repository.pop(
              "observed_latest_merged_pull_request"
          )
          repository["main_advanced_during_increment"] = {
              "head": "855ef85f898cbf34db2931abc8344d05cb05c6f7",
              "merged_pull_request": 125,
              "source_head": "315a310ae4ff3db7d5d100ea0320911043b77564",
              "exact_source_ci_run_id": 30203314001,
              "exact_source_ci_conclusion": "success",
              "changed_paths_overlap_this_increment": False,
          }
          repository["branch_relation_to_current_main"] = {
              "merge_base": "50ae9113fafccbe31b3e2d076c021c814e4f446d",
              "status": "diverged_without_changed_path_overlap",
          }
          evidence = reconciliation["promoted_azure_evidence_boundary"]
          evidence["public_endpoint"] = "st-demo-api-aeg30000.westus2.cloudapp.azure.com"
          evidence["expected_azure_host"] = expected_host
          evidence["independent_endpoint_role"] = "historical_supporting_evidence_not_golden_path"
          reconciliation["increment"]["collector_endpoint_corrected"] = True
          reconciliation["increment"]["api_provenance_contract_deployed"] = False
          reconciliation["next_gate"]["required_before_live_activation"] = [
              "review and merge the exact pull-request head after CI succeeds",
              "select the exact merge commit as deployment source",
              "capture fresh Azure state, cost or credit evidence, and FullResourcePayloads What-If",
              "obtain one-shot deployment and rollback authority for the existing collector VM extension",
              "verify health identity, CORS, browser rendering, and one request-ID correlation path",
          ]
          for marker in (
              "API_compatible != collector_golden_path",
              "expected_resource_group != observed_resource_group",
              "monitor_rendered != provenance_contract_deployed",
          ):
              if marker not in reconciliation["canonical_distinctions"]:
                  reconciliation["canonical_distinctions"].append(marker)
          reconciliation_path.write_text(
              json.dumps(reconciliation, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Validate repository increment
        run: |
          set -euo pipefail
          python -m py_compile demo_api/standalone_server.py .project/validate.py
          python infra/tests/test_frontend_azure_provenance_monitor.py
          python -m unittest discover -s infra/tests -p 'test_frontend*.py'
          python infra/tests/test_collector_demo_api.py
          python .project/validate.py

      - name: Remove one-shot workflow and commit exact result
        run: |
          set -euo pipefail
          rm .github/workflows/apply-provenance-monitor-reconciliation-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Reconcile provenance monitor with collector golden path"
          git push origin "HEAD:$BRANCH"
