name: Apply frontend live-default validator fix from PR

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-frontend-live-default-validator-fix-pr.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'activate/frontend-live-api-default'
    name: Apply exact validation patch and self-remove
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply deterministic patch
        run: |
          set -euo pipefail
          python3 .project/tmp/apply_frontend_live_default_validation_fix.py

      - name: Run focused validation without discarding repair
        id: focused
        continue-on-error: true
        run: |
          set -o pipefail
          {
            python3 .project/validate.py
            python3 -m unittest \
              infra.tests.test_collector_demo_api \
              infra.tests.test_frontend_api_demo_lab_integration \
              infra.tests.test_frontend_live_default_activation \
              -v
            node --check scripts/verify_frontend_live_default.mjs
          } 2>&1 | tee /tmp/frontend-live-default-focused-validation.log

      - name: Remove transient helpers and commit deterministic repair
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm --ignore-unmatch \
            .github/workflows/apply-frontend-live-default-validator-fix.yml \
            .github/workflows/apply-frontend-live-default-validator-fix-v2.yml \
            .github/workflows/apply-frontend-live-default-validator-fix-pr.yml \
            .project/tmp/apply_frontend_live_default_validation_fix.py
          git add -A
          git commit -m "Bind frontend live default to exact deployment evidence"
          git push origin HEAD:${{ github.head_ref }}

      - name: Preserve focused validation result
        if: always()
        run: |
          if [[ '${{ steps.focused.outcome }}' != 'success' ]]; then
            echo 'Focused validation found a residual contract. The deterministic repair was committed; rely on the new PR CI artifacts for the exact remaining failure.' >&2
            exit 1
          fi
