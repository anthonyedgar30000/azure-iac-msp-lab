name: Diagnose collector golden path remediation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/reconcile-collector-golden-path-pr.yml

permissions:
  contents: read

concurrency:
  group: complete-collector-golden-path-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/complete-collector-golden-path-reconciliation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_MAIN: 855ef85f898cbf34db2931abc8344d05cb05c6f7
      BRANCH: agent/complete-collector-golden-path-reconciliation
    steps:
      - name: Check out exact remediation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Enforce exact repository boundary
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$BRANCH"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git merge-base HEAD origin/main)" = "$EXPECTED_MAIN"

      - name: Generate bounded reconciliation from validated helper
        run: |
          set -euo pipefail
          python - <<'EXTRACT'
          from pathlib import Path
          from textwrap import dedent

          source = Path('.github/workflows/reconcile-collector-golden-path-once.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          payload = dedent(source[start:end]) + "\n"
          replacements = (
              (
                  '    "infra/tests/test_frontend_api_demo_lab_integration.py",',
                  '    "infra/tests/test_collector_demo_api.py",\n    "infra/tests/test_frontend_api_demo_lab_integration.py",',
              ),
              (
                  'Repository binding does not prove GitHub Pages publication or browser-path completion, and the independent VM API is not the collector golden path.',
                  'Repository binding does not by itself prove GitHub Pages publication or browser-path completion, and the independent VM API is not the collector golden path.',
              ),
              (
                  'MAIN = "50ae9113fafccbe31b3e2d076c021c814e4f446d"',
                  'MAIN = "855ef85f898cbf34db2931abc8344d05cb05c6f7"',
              ),
              (
                  'SOURCE_HEAD = "dcfcc66f1ce9b2c49ffa5cbdca94c33d80716609"',
                  'SOURCE_HEAD = "315a310ae4ff3db7d5d100ea0320911043b77564"',
              ),
              ('SOURCE_CI = 30201933461', 'SOURCE_CI = 30203314001'),
              ('"latest_merged_pull_request": 124,', '"latest_merged_pull_request": 125,'),
              (
                  '"observation_boundary": "Observed after closing consumed PR #123 and before creating the reconciliation PR.",',
                  '"observation_boundary": "Observed after PR #125 merged repository-only helper workflows and before this remediation PR.",',
              ),
              ('latest merge: PR #124', 'latest merge: PR #125'),
              ('PR #124 exact source:', 'PR #125 exact source:'),
              ('PR #124 exact-head CI:', 'PR #125 exact-head CI:'),
              ('after PR #124.', 'after PR #125.'),
              ('self.assertEqual(repo["latest_merged_pull_request"], 124)', 'self.assertEqual(repo["latest_merged_pull_request"], 125)'),
          )
          for old, new in replacements:
              if old not in payload:
                  raise SystemExit(f'missing expected payload marker: {old}')
              payload = payload.replace(old, new)
          Path('/tmp/reconcile_collector_golden_path.py').write_text(payload, encoding='utf-8')
          EXTRACT
          python /tmp/reconcile_collector_golden_path.py
          python - <<'PATCH'
          from pathlib import Path

          path = Path('infra/tests/test_collector_demo_api.py')
          text = path.read_text(encoding='utf-8')
          old = 'live_default_pending_github_pages_verification'
          new = 'collector_live_default_pending_github_pages_verification'
          if old not in text:
              raise SystemExit('stale activation assertion not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PATCH

      - name: Run all validation and preserve output
        id: validate
        run: |
          set +e
          status=0
          {
            echo '=== workflow observability validator ==='
            python .project/validate.py || status=$?
            echo '=== complete unit-test suite ==='
            python -m unittest discover -s infra/tests -p 'test_*.py' || status=$?
            echo '=== browser verifier syntax ==='
            node --check scripts/verify_frontend_live_default.mjs || status=$?
            echo '=== collector endpoint present ==='
            grep -F "https://st-demo-api-aeg30000.westus2.cloudapp.azure.com/api/demo/run" docs/report-source.json || status=$?
            echo '=== independent endpoint absent from active config ==='
            if grep -F "https://st-demo-api-vm-aeg30000.westus2.cloudapp.azure.com/api/demo/run" docs/report-source.json; then status=1; fi
            echo '=== diff check ==='
            git diff --check || status=$?
          } > remediation-validation.log 2>&1
          git status --short > remediation-status.txt
          git diff > remediation.patch
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat remediation-validation.log
          exit 0

      - name: Upload remediation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collector-golden-path-remediation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            remediation-validation.log
            remediation-status.txt
            remediation.patch
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed when any validation failed
        if: steps.validate.outputs.status != '0'
        run: |
          cat remediation-validation.log >&2
          exit 1
