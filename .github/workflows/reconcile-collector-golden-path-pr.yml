name: Package validated collector reconciliation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/reconcile-collector-golden-path-once.yml
      - .github/workflows/reconcile-collector-golden-path-pr.yml

permissions:
  contents: read

concurrency:
  group: reconcile-collector-golden-path-pr
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/reconcile-collector-golden-path'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_MAIN: 50ae9113fafccbe31b3e2d076c021c814e4f446d
      BRANCH: agent/reconcile-collector-golden-path
    steps:
      - name: Check out exact head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Enforce exact repository boundary
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$BRANCH"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git merge-base HEAD origin/main)" = "$EXPECTED_MAIN"

      - name: Extract and execute bounded reconciliation
        run: |
          set -euo pipefail
          python - <<'EXTRACT'
          from pathlib import Path
          from textwrap import dedent

          source = Path('.github/workflows/reconcile-collector-golden-path-once.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          payload = dedent(source[start:end]) + "\n"
          payload = payload.replace(
              '    "infra/tests/test_frontend_api_demo_lab_integration.py",',
              '    "infra/tests/test_collector_demo_api.py",\n    "infra/tests/test_frontend_api_demo_lab_integration.py",',
              1,
          )
          payload = payload.replace(
              'Repository binding does not prove GitHub Pages publication or browser-path completion, and the independent VM API is not the collector golden path.',
              'Repository binding does not by itself prove GitHub Pages publication or browser-path completion, and the independent VM API is not the collector golden path.',
              1,
          )
          Path('/tmp/reconcile_collector_golden_path.py').write_text(payload, encoding='utf-8')
          EXTRACT
          python /tmp/reconcile_collector_golden_path.py
          python - <<'PATCH'
          from pathlib import Path
          path = Path('infra/tests/test_collector_demo_api.py')
          text = path.read_text(encoding='utf-8')
          old = 'live_default_pending_github_pages_verification'
          new = 'collector_live_default_pending_github_pages_verification'
          if old not in text:
              raise SystemExit('stale activation assertion not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PATCH

      - name: Validate complete reconciliation
        run: |
          set -euo pipefail
          python .project/validate.py
          python -m unittest discover -s infra/tests -p 'test_*.py'
          node --check scripts/verify_frontend_live_default.mjs
          grep -F "https://st-demo-api-aeg30000.westus2.cloudapp.azure.com/api/demo/run" docs/report-source.json
          ! grep -F "https://st-demo-api-vm-aeg30000.westus2.cloudapp.azure.com/api/demo/run" docs/report-source.json
          git diff --check

      - name: Package only intended repository files
        run: |
          set -euo pipefail
          mkdir -p reconciled-output
          while IFS= read -r path; do
            mkdir -p "reconciled-output/$(dirname "$path")"
            cp "$path" "reconciled-output/$path"
          done <<'FILES'
          .project/current-reality-v2.json
          .project/handoffs/current-state.md
          .project/lab-v1-completion-gate-v2.json
          .project/reconciliations/collector-golden-path-reconciliation-20260726.json
          .project/state-index.json
          .project/validate.py
          docs/report-source.json
          docs/reviews/canonical-current-reality-v2.md
          docs/reviews/frontend-live-default-activation-20260726.md
          infra/tests/test_canonical_state_index_v2.py
          infra/tests/test_collector_demo_api.py
          infra/tests/test_collector_golden_path_binding.py
          infra/tests/test_frontend_api_demo_lab_integration.py
          infra/tests/test_frontend_live_default_activation.py
          scripts/verify_frontend_live_default.mjs
          FILES
          git diff --stat > reconciled-output/VALIDATION-SUMMARY.txt
          printf '%s\n' \
            'workflow-observability validator: passed' \
            'unit tests: passed' \
            'browser verifier syntax: passed' \
            'collector endpoint binding: passed' \
            'diff check: passed' \
            >> reconciled-output/VALIDATION-SUMMARY.txt

      - name: Upload validated reconciliation bundle
        uses: actions/upload-artifact@v4
        with:
          name: validated-collector-golden-path-${{ github.run_id }}-${{ github.run_attempt }}
          path: reconciled-output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
