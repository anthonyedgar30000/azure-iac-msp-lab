name: Collector-hosted demo API — quarantined

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Bounded collector-hosted demo API operation'
        required: true
        type: choice
        options: [what-if, deploy, verify]
      reviewed_commit:
        description: 'Exact reviewed commit containing the requested implementation'
        required: true
        type: string
      environment:
        description: 'Lab environment'
        required: true
        default: dev
        type: choice
        options: [dev, test]
      resource_group:
        description: 'Existing ServiceTracer resource group'
        required: true
        default: rg-servicetracer-dev-westus2
        type: string
      location:
        description: 'Expected Azure region'
        required: true
        default: westus2
        type: string
      prefix:
        description: 'Bicep resource-name prefix'
        required: true
        default: mst
        type: string
      dns_label:
        description: 'Globally unique Azure public-IP DNS label'
        required: true
        default: st-demo-api-aeg30000
        type: string
      allowed_origin:
        description: 'Exact browser origin allowed by CORS'
        required: true
        default: https://anthonyedgar30000.github.io
        type: string
      confirmation:
        description: 'Enter COLLECTOR-DEMO-API:<operation>:<resource-group>:<dns-label>'
        required: true
        type: string

# Emergency fail-closed boundary after the correlation-identity one-shot workflow
# was rerun after its grant had already been consumed. This workflow deliberately
# has no id-token permission, Azure environment, cloud login, or mutation command.
permissions:
  contents: read

concurrency:
  group: collector-demo-api-quarantine-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  reject-quarantined-operation:
    name: Reject quarantined collector operation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate request shape without cloud access
        env:
          OPERATION: ${{ inputs.operation }}
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          LAB_ENVIRONMENT: ${{ inputs.environment }}
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          LOCATION: ${{ inputs.location }}
          PREFIX: ${{ inputs.prefix }}
          DNS_LABEL: ${{ inputs.dns_label }}
          ALLOWED_ORIGIN: ${{ inputs.allowed_origin }}
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$OPERATION" =~ ^(what-if|deploy|verify)$ ]]
          [[ "$REVIEWED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$LAB_ENVIRONMENT" =~ ^(dev|test)$ ]]
          [[ "$RESOURCE_GROUP" =~ ^rg-servicetracer-(dev|test)(-[a-z0-9-]+)?$ ]]
          [[ "$LOCATION" =~ ^[a-z0-9]+$ ]]
          [[ "$PREFIX" =~ ^[a-z0-9]{2,12}$ ]]
          [[ "$DNS_LABEL" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]]
          [[ "$ALLOWED_ORIGIN" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]]
          expected="COLLECTOR-DEMO-API:${OPERATION}:${RESOURCE_GROUP}:${DNS_LABEL}"
          [[ "$CONFIRMATION" == "$expected" ]] || {
            echo "Confirmation must exactly equal: $expected" >&2
            exit 1
          }
          echo "::error::Collector-hosted Azure operations are quarantined after an unauthorized replay of consumed one-shot authority. No Azure login or mutation was attempted."
          exit 1

